<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>剧情框架 · Plot Studio</title>
<style>
/* ==========================================================================
   0. 令牌
   ========================================================================== */
:root{
  --bg:#0d1017;
  --bg-canvas:#0a0d13;
  --panel:#141924;
  --panel-2:#1a2130;
  --panel-3:#212a3b;
  --line:#242d3d;
  --line-soft:#1c2432;
  --text:#e8eef7;
  --text-dim:#9aa7bb;
  --text-faint:#66738a;
  --accent:#5b9dff;
  --accent-soft:rgba(91,157,255,.14);
  --accent-2:#b07cff;
  --ok:#3fb950;
  --warn:#e3a23c;
  --danger:#f06060;
  --main:#4a9eff;
  --side:#3fb9a0;
  --axis-main:#4a9eff;
  --axis-char:#e0a13a;
  --axis-event:#b07cff;
  --radius:10px;
  --radius-sm:7px;
  --shadow:0 8px 28px rgba(0,0,0,.45);
  --mono:"JetBrains Mono","Cascadia Mono",Consolas,monospace;
  --sans:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2b3546;border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#3c4a60;background-clip:content-box}

/* ==========================================================================
   1. 骨架
   ========================================================================== */
#app{
  display:grid;height:100vh;
  grid-template-columns:260px 1fr 320px;
  grid-template-rows:46px 1fr auto;
  grid-template-areas:"top top top" "left canvas right" "left ai right";
}
.topbar{grid-area:top}
.leftbar{grid-area:left}
.canvas-wrap{grid-area:canvas}
.rightbar{grid-area:right}
.ai-drawer{grid-area:ai}

/* ==========================================================================
   2. 顶栏
   ========================================================================== */
.topbar{
  display:flex;align-items:center;gap:8px;padding:0 12px;
  background:var(--panel);border-bottom:1px solid var(--line);z-index:40;
}
.brand{display:flex;align-items:center;gap:8px;padding-right:10px;margin-right:4px;border-right:1px solid var(--line)}
.brand-mark{
  width:20px;height:20px;border-radius:6px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
}
.brand-name{font-weight:600;letter-spacing:.3px;white-space:nowrap}
.proj-name{
  background:transparent;border:1px solid transparent;border-radius:6px;
  padding:3px 8px;min-width:120px;max-width:230px;font-weight:500;
}
.proj-name:hover{border-color:var(--line)}
.proj-name:focus{outline:none;border-color:var(--accent);background:var(--bg)}
.tb-sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.tb-btn{
  display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:7px;
  color:var(--text-dim);white-space:nowrap;transition:background .12s,color .12s;
}
.tb-btn:hover{background:var(--panel-3);color:var(--text)}
.tb-btn.on{background:var(--accent-soft);color:var(--accent)}
.tb-btn.danger:hover{color:var(--danger)}
.tb-btn[disabled]{opacity:.35;cursor:not-allowed}
.tb-spacer{flex:1}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;
  font-size:11px;background:var(--panel-3);color:var(--text-dim);white-space:nowrap;
}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--text-faint)}
.pill.ok .dot{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.pill.warn .dot{background:var(--warn)}
.pill.err .dot{background:var(--danger)}
.pill.busy .dot{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

/* 视图切换 */
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{padding:4px 11px;border-radius:6px;color:var(--text-dim);font-size:12px}
.seg button.on{background:var(--panel-3);color:var(--text)}

/* ==========================================================================
   3. 侧栏通用
   ========================================================================== */
.side{
  background:var(--panel);display:flex;flex-direction:column;overflow:hidden;
}
.leftbar{border-right:1px solid var(--line)}
.rightbar{border-left:1px solid var(--line)}
.side-scroll{overflow-y:auto;overflow-x:hidden;flex:1;padding-bottom:24px}
.section{border-bottom:1px solid var(--line-soft)}
.sec-head{
  display:flex;align-items:center;gap:7px;padding:9px 12px;cursor:pointer;user-select:none;
  color:var(--text-dim);font-size:11.5px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;
}
.sec-head:hover{color:var(--text)}
.sec-head .caret{font-size:9px;transition:transform .15s;color:var(--text-faint)}
.section.collapsed .caret{transform:rotate(-90deg)}
.section.collapsed .sec-body{display:none}
.sec-head .count{margin-left:auto;font-size:10px;color:var(--text-faint);font-weight:400;text-transform:none;letter-spacing:0}
.sec-head .add{margin-left:auto;color:var(--text-faint);padding:0 3px;border-radius:4px;font-size:14px;line-height:1}
.sec-head .add:hover{color:var(--accent);background:var(--panel-3)}
.sec-body{padding:0 8px 8px}

.row{
  display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;
  cursor:pointer;color:var(--text-dim);transition:background .1s,color .1s;position:relative;
}
.row:hover{background:var(--panel-2);color:var(--text)}
.row.sel{background:var(--accent-soft);color:var(--text)}
.row.sel::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;border-radius:2px;background:var(--accent)}
.row .swatch{width:8px;height:8px;border-radius:3px;flex:0 0 auto}
.row .label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:10.5px;color:var(--text-faint);flex:0 0 auto}
.row .eye{opacity:.45;font-size:11px;padding:1px 3px;border-radius:4px}
.row .eye:hover{opacity:1;background:var(--panel-3)}
.row.dim{opacity:.4}
.row .kill{opacity:0;font-size:13px;padding:1px 4px;border-radius:4px;color:var(--text-faint)}
.row:hover .kill{opacity:1}
.row .kill:hover{color:var(--danger);background:var(--panel-3)}

.indent-1{padding-left:22px}
.indent-2{padding-left:36px}
.empty-note{padding:7px 10px;color:var(--text-faint);font-size:11.5px;font-style:normal;opacity:.75}

/* ==========================================================================
   4. 画布
   ========================================================================== */
.canvas-wrap{position:relative;overflow:hidden;background:var(--bg-canvas);contain:strict}
#grid{
  position:absolute;inset:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:32px 32px;
}
#axisLayer{position:absolute;left:0;top:0;pointer-events:none}
.band{position:absolute;pointer-events:none}
.divider{position:absolute;width:1px;pointer-events:auto;cursor:ew-resize}
.divider::after{content:"";position:absolute;left:-4px;right:-4px;top:0;bottom:0}
.divider:hover{box-shadow:0 0 0 1px currentColor}
.divider.sub{opacity:.42}
.divider-hit-flash{animation:flash .6s}
@keyframes flash{0%,100%{opacity:1}50%{opacity:.15}}
.chip{
  position:absolute;pointer-events:auto;cursor:pointer;white-space:nowrap;
  padding:2px 9px;border-radius:0 0 7px 7px;font-size:11px;font-weight:600;
  transform:translateX(-1px);backdrop-filter:blur(3px);user-select:none;
  border:1px solid rgba(255,255,255,.09);border-top:none;max-width:260px;
  overflow:hidden;text-overflow:ellipsis;
}
.chip:hover{filter:brightness(1.25)}
.chip .ci{opacity:.6;font-weight:400;margin-left:5px}
.axis-tag{
  position:absolute;left:0;pointer-events:auto;cursor:pointer;white-space:nowrap;
  padding:2px 10px 2px 8px;border-radius:0 7px 7px 0;font-size:10.5px;font-weight:700;
  letter-spacing:.5px;user-select:none;border:1px solid rgba(255,255,255,.1);border-left:none;
}
.axis-tag:hover{filter:brightness(1.3)}
.axis-tag .num{opacity:.6;font-weight:400;margin-left:6px}

#world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#svgLayer{position:absolute;top:0;left:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#nodeLayer{position:absolute;top:0;left:0}
/* 章节标签与轴名固定在屏幕层，不随纵向平移跑掉 */
#chipLayer{position:absolute;left:0;top:0;right:0;height:0;pointer-events:none;overflow:visible;z-index:12}

.edge{fill:none;stroke-linecap:round;transition:stroke .12s}
.edge-dep{stroke:#4d5b73;stroke-width:1.6}
.edge-dep.hot{stroke:var(--accent);stroke-width:2.4}
.edge-link{stroke:var(--accent-2);stroke-width:1.3;stroke-dasharray:5 5;opacity:.6}
.edge-link.hot{opacity:1;stroke-width:2}
/* 未回收的伏笔：暖色 + 更密的虚线，一眼能和普通引用线区分开 */
.edge-link.open{stroke:var(--warn);stroke-dasharray:3 3;opacity:.85}
.edge-ghost{stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4}
.edge-hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
.edge-label{font-size:9.5px;fill:#8b97ab;pointer-events:none;font-family:var(--sans)}
.edge-chip{pointer-events:all;cursor:pointer}
.arrow-head{fill:#4d5b73}
.arrow-head.hot{fill:var(--accent)}
.arrow-head-link{fill:var(--accent-2)}

/* 节点 */
.node{
  position:absolute;width:196px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:var(--radius);padding:8px 10px 9px;cursor:grab;user-select:none;
  box-shadow:0 2px 10px rgba(0,0,0,.35);transition:border-color .12s,box-shadow .12s,opacity .15s;
}
.node:hover{border-color:#3a4760}
.node.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),0 6px 20px rgba(0,0,0,.5)}
.node.dragging{cursor:grabbing;z-index:20;box-shadow:0 12px 32px rgba(0,0,0,.6)}
.node.muted{opacity:.16;pointer-events:none}
.node.dim{opacity:.34}
.node.focus{box-shadow:0 0 0 2px rgba(255,255,255,.16),0 8px 26px rgba(0,0,0,.55)}
.node.k-main{border-left:3px solid var(--main)}
.node.k-side{border-left:3px solid var(--side)}
.node .n-head{display:flex;align-items:flex-start;gap:6px}
.node .n-title{
  flex:1;font-weight:600;font-size:12.5px;line-height:1.35;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  word-break:break-word;
}
.node .n-sum{
  margin-top:5px;font-size:11px;color:var(--text-faint);line-height:1.45;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.node .n-foot{display:flex;align-items:center;gap:5px;margin-top:7px;flex-wrap:wrap}
.tag{
  font-size:9.5px;padding:1px 6px;border-radius:5px;background:var(--panel-3);
  color:var(--text-dim);white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis;
}
.tag.t-main{background:rgba(74,158,255,.16);color:#8cc0ff}
.tag.t-side{background:rgba(63,185,160,.16);color:#6fd8bf}
.tag.t-passive{background:rgba(255,255,255,.06);color:var(--text-faint)}
.tag.t-active{background:rgba(227,162,60,.16);color:#edc072}
.tag.t-place{background:rgba(176,124,255,.13);color:#c9a4ff}
.tag.t-char{background:rgba(240,96,96,.13);color:#ff9d9d}
.tag.t-scene{background:rgba(255,255,255,.07)}
.tag.t-focus{background:var(--accent-soft);color:var(--accent)}
.n-dot{width:5px;height:5px;border-radius:50%;flex:0 0 auto}
.n-dot.passive{background:var(--text-faint)}
.n-dot.active{background:var(--warn);box-shadow:0 0 6px rgba(227,162,60,.7)}
.node .handle{
  position:absolute;width:11px;height:11px;border-radius:50%;background:var(--panel-3);
  border:1.5px solid #4a5872;opacity:0;transition:opacity .12s,transform .12s;
}
.node:hover .handle,.node.sel .handle{opacity:1}
.node .handle:hover{background:var(--accent);border-color:var(--accent);transform:scale(1.25)}
.node .handle.r{right:-6px;top:50%;margin-top:-5.5px;cursor:crosshair}
.node .handle.l{left:-6px;top:50%;margin-top:-5.5px;cursor:crosshair}
.node .n-warn{
  position:absolute;top:-7px;right:-7px;width:15px;height:15px;border-radius:50%;
  background:var(--warn);color:#1a1206;font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
/* 埋了伏笔还没回收：挂在卡片左上角 */
.node .n-hook{
  position:absolute;top:-7px;left:-7px;width:15px;height:15px;border-radius:50%;
  background:var(--warn);color:#1a1206;font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px rgba(227,162,60,.25);
}
.node.multi{border-color:var(--accent-2);box-shadow:0 0 0 2px rgba(176,124,255,.2)}
.marquee{position:absolute;border:1px solid var(--accent);background:var(--accent-soft);pointer-events:none;z-index:26;border-radius:3px}
.req-row{display:grid;grid-template-columns:64px 1fr 1fr 28px;gap:6px;align-items:center;margin-bottom:6px}
.req-row .inp,.req-row .sel{padding:4px 6px;font-size:11.5px}
.search-row{display:flex;gap:6px;align-items:center;padding:2px 8px 8px}
.search-row .inp{padding:4px 8px;font-size:12px}
.batch-bar{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* 画布浮层控件 */
.cv-overlay{position:absolute;z-index:30;pointer-events:none}
.cv-overlay > *{pointer-events:auto}
.cv-tl{top:10px;left:10px;display:flex;gap:6px;flex-direction:column;align-items:flex-start}
.cv-tr{top:10px;right:10px;display:flex;gap:6px;align-items:center}
.cv-bl{bottom:12px;left:10px}
.cv-hint{
  background:rgba(20,25,36,.88);border:1px solid var(--line);border-radius:8px;
  padding:6px 11px;color:var(--text-faint);font-size:11px;backdrop-filter:blur(6px);
}
.floating{
  background:rgba(20,25,36,.9);border:1px solid var(--line);border-radius:9px;
  display:flex;overflow:hidden;backdrop-filter:blur(8px);box-shadow:var(--shadow);
}
.floating button{padding:5px 10px;color:var(--text-dim);font-size:12px}
.floating button:hover{background:var(--panel-3);color:var(--text)}
.floating button.on{background:var(--accent-soft);color:var(--accent)}
.floating .vsep{width:1px;background:var(--line)}
.zoom-read{min-width:52px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--text-dim);padding:5px 4px}
.legend{
  display:flex;flex-direction:column;gap:3px;background:rgba(20,25,36,.8);
  border:1px solid var(--line);border-radius:8px;padding:7px 10px;backdrop-filter:blur(6px);
}
.legend .li{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--text-faint)}
.legend .li i{width:16px;height:0;border-top:2px solid;display:inline-block}

/* 空态 */
.canvas-empty{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:10px;color:var(--text-faint);pointer-events:none;text-align:center;
}
.canvas-empty h3{font-size:15px;color:var(--text-dim);font-weight:600}
.canvas-empty p{font-size:12px;max-width:340px;line-height:1.7}

/* ==========================================================================
   5. 检查器
   ========================================================================== */
.insp{padding:12px}
.insp-empty{padding:26px 14px;text-align:center;color:var(--text-faint);font-size:12px;line-height:1.8}
.insp-title{
  display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin-bottom:3px;
}
.insp-sub{font-size:11px;color:var(--text-faint);margin-bottom:12px;font-family:var(--mono)}
.field{margin-bottom:11px}
.field > label{
  display:block;font-size:10.5px;color:var(--text-faint);margin-bottom:4px;
  letter-spacing:.4px;text-transform:uppercase;font-weight:600;
}
.inp,.ta,.sel{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;
  padding:6px 9px;transition:border-color .12s;color:var(--text);
}
.inp:focus,.ta:focus,.sel:focus{outline:none;border-color:var(--accent)}
.ta{resize:vertical;min-height:64px;line-height:1.6;font-size:12.5px}
.sel{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-faint) 50%),linear-gradient(135deg,var(--text-faint) 50%,transparent 50%);background-position:calc(100% - 14px) 13px,calc(100% - 9px) 13px;background-size:5px 5px;background-repeat:no-repeat}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:6px 12px;border-radius:7px;background:var(--panel-3);color:var(--text-dim);
  border:1px solid var(--line);transition:all .12s;
}
.btn:hover{background:#2a3446;color:var(--text)}
.btn.primary{background:var(--accent);color:#06101f;border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:#ff9d9d;border-color:rgba(240,96,96,.3)}
.btn.danger:hover{background:rgba(240,96,96,.16);color:#ffc0c0}
.btn.block{width:100%}
.btn.sm{padding:3px 9px;font-size:11.5px}
.chip-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.chip-tag{
  display:inline-flex;align-items:center;gap:5px;padding:2px 4px 2px 9px;border-radius:14px;
  background:var(--panel-3);font-size:11px;color:var(--text-dim);
}
.chip-tag b{font-weight:500;color:var(--text)}
.chip-tag button{color:var(--text-faint);padding:0 4px;line-height:1;border-radius:50%}
.chip-tag button:hover{color:var(--danger)}
.picker{position:relative}
.picker-menu{
  position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--panel-2);
  border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:60;
  max-height:200px;overflow-y:auto;padding:4px;
}
.picker-menu .pm{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:12px}
.picker-menu .pm:hover{background:var(--panel-3)}
.picker-menu .pm .sub{margin-left:auto;font-size:10px;color:var(--text-faint)}
.insp-actions{display:flex;gap:7px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft)}
.meta-list{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.meta-row{display:flex;gap:8px;font-size:11.5px;color:var(--text-faint)}
.meta-row b{color:var(--text-dim);font-weight:500;flex:0 0 62px}
.meta-row span{flex:1;word-break:break-all}
.dep-list{display:flex;flex-direction:column;gap:4px}
.dep-item{
  display:flex;align-items:center;gap:7px;padding:4px 7px;border-radius:6px;
  background:var(--bg);font-size:11.5px;cursor:pointer;border:1px solid var(--line-soft);
}
.dep-item:hover{border-color:var(--accent)}
.dep-item .dir{color:var(--text-faint);font-family:var(--mono);font-size:10px}
.dep-item .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dep-item .x{opacity:0;color:var(--text-faint);padding:0 3px}
.dep-item:hover .x{opacity:1}
.dep-item .x:hover{color:var(--danger)}

/* ==========================================================================
   6. AI 抽屉
   ========================================================================== */
.ai-drawer{
  border-top:1px solid var(--line);background:var(--panel);
  display:flex;flex-direction:column;height:280px;transition:height .18s;overflow:hidden;
}
.ai-drawer.closed{height:34px}
.ai-drawer.tall{height:440px}
.ai-head{
  display:flex;align-items:center;gap:9px;padding:6px 12px;height:34px;flex:0 0 34px;
  cursor:pointer;border-bottom:1px solid var(--line-soft);
}
.ai-head:hover{background:var(--panel-2)}
.ai-head .ttl{font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:7px}
.ai-head .caret{color:var(--text-faint);font-size:9px}
.ai-body{flex:1;display:grid;grid-template-columns:220px 1fr;overflow:hidden}
.ai-left{border-right:1px solid var(--line-soft);overflow-y:auto;padding:10px}
.ai-main{display:flex;flex-direction:column;overflow:hidden}
.chat-scroll{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:11px}
.msg{display:flex;gap:9px;max-width:100%}
.msg .av{
  width:22px;height:22px;border-radius:6px;flex:0 0 auto;display:flex;
  align-items:center;justify-content:center;font-size:10px;font-weight:700;
}
.msg.user .av{background:var(--panel-3);color:var(--text-dim)}
.msg.ai .av{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#06101f}
.msg .bd{flex:1;min-width:0}
.msg .who{font-size:10.5px;color:var(--text-faint);margin-bottom:3px}
.bubble{
  background:var(--panel-2);border:1px solid var(--line-soft);border-radius:9px;
  padding:8px 11px;font-size:12.5px;line-height:1.7;word-break:break-word;white-space:pre-wrap;
}
.msg.user .bubble{background:var(--panel-3)}
.bubble code{font-family:var(--mono);font-size:11.5px;background:var(--bg);padding:1px 5px;border-radius:4px}
.bubble pre{background:var(--bg);border:1px solid var(--line-soft);border-radius:7px;padding:9px;overflow-x:auto;margin:7px 0}
.bubble pre code{background:none;padding:0}
.bubble h4{font-size:12.5px;margin:8px 0 4px;color:var(--accent)}
.bubble ul{padding-left:18px;margin:4px 0}
.bubble strong{color:#fff}
.chat-input{border-top:1px solid var(--line-soft);padding:9px 12px;display:flex;flex-direction:column;gap:7px}
.chat-input textarea{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;resize:none;min-height:44px;max-height:130px;line-height:1.6;font-size:12.5px;
}
.chat-input textarea:focus{outline:none;border-color:var(--accent)}
.chat-row{display:flex;align-items:center;gap:7px}
.chat-row .hint{font-size:10.5px;color:var(--text-faint)}
.quick{display:flex;gap:5px;flex-wrap:wrap}
.quick button{
  font-size:11px;padding:3px 9px;border-radius:13px;background:var(--panel-2);
  border:1px solid var(--line);color:var(--text-dim);
}
.quick button:hover{border-color:var(--accent);color:var(--accent)}
.ctx-scope{display:flex;flex-direction:column;gap:5px}
.scope-opt{
  display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:6px;cursor:pointer;
  font-size:11.5px;color:var(--text-dim);border:1px solid transparent;
}
.scope-opt:hover{background:var(--panel-2)}
.scope-opt.on{background:var(--accent-soft);color:var(--accent);border-color:rgba(91,157,255,.3)}
.ctx-preview{
  margin-top:8px;padding:8px;background:var(--bg);border:1px solid var(--line-soft);
  border-radius:7px;font-size:10.5px;color:var(--text-faint);font-family:var(--mono);
  max-height:150px;overflow-y:auto;line-height:1.65;white-space:pre-wrap;word-break:break-all;
}
.ai-sec-title{font-size:10.5px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.6px;margin:12px 0 6px}
.ai-sec-title:first-child{margin-top:0}

/* 提案 */
.proposal{
  border:1px solid rgba(227,162,60,.35);background:rgba(227,162,60,.06);
  border-radius:9px;padding:10px 12px;margin-top:4px;
}
.proposal .p-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.proposal .p-kind{
  font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;
  background:rgba(227,162,60,.2);color:#edc072;letter-spacing:.4px;
}
.proposal .p-kind.auto{background:rgba(63,185,80,.18);color:#7ee08d}
.proposal .p-title{flex:1;font-size:12px;font-weight:600}
.proposal .p-diff{
  background:var(--bg);border:1px solid var(--line-soft);border-radius:7px;
  padding:8px 10px;font-family:var(--mono);font-size:11px;line-height:1.7;
  max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-all;
}
.diff-add{color:#7ee08d}
.diff-del{color:#ff9d9d}
.diff-ctx{color:var(--text-faint)}
.proposal .p-acts{display:flex;gap:7px;margin-top:9px}

/* ==========================================================================
   7. 模态
   ========================================================================== */
.mask{
  position:fixed;inset:0;background:rgba(4,7,12,.72);backdrop-filter:blur(3px);
  z-index:200;display:flex;align-items:center;justify-content:center;padding:34px;
}
.mask.hide{display:none}
.modal{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;
  max-height:100%;width:100%;max-width:880px;
}
.modal.wide{max-width:1080px}
.modal.narrow{max-width:520px}
.m-head{
  display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);
}
.m-head .m-title{font-weight:600;font-size:14px;flex:1}
.m-head .m-sub{font-size:11px;color:var(--text-faint);font-family:var(--mono)}
.m-close{color:var(--text-faint);font-size:18px;padding:0 6px;border-radius:6px;line-height:1}
.m-close:hover{color:var(--text);background:var(--panel-3)}
.m-body{padding:16px;overflow-y:auto;flex:1}
.m-foot{
  display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);
  background:var(--panel-2);align-items:center;
}
.m-foot .sp{flex:1}

/* 步骤编辑器 */
.steps{display:flex;flex-direction:column;gap:7px}
.step{
  display:flex;gap:9px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:9px;padding:9px 10px;align-items:flex-start;
}
.step.dragging{opacity:.4}
.step .s-grip{
  cursor:grab;color:var(--text-faint);font-size:13px;padding:2px 3px;line-height:1;
  user-select:none;flex:0 0 auto;
}
.step .s-grip:active{cursor:grabbing}
.step .s-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.step .s-top{display:flex;gap:7px;align-items:center}
.step .s-type{
  background:var(--panel-3);border:1px solid var(--line);border-radius:6px;
  padding:2px 8px;font-size:11px;cursor:pointer;
}
.step .s-num{color:var(--text-faint);font-family:var(--mono);font-size:10.5px}
.step .s-del{color:var(--text-faint);padding:2px 6px;border-radius:5px}
.step .s-del:hover{color:var(--danger);background:var(--panel-3)}
.step .s-fields{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.step .s-fields.one{grid-template-columns:1fr}
.step .mini-label{font-size:10px;color:var(--text-faint);margin-bottom:2px;display:block}
.type-main{color:#8cc0ff}
.type-narr{color:#c9a4ff}
.type-battle{color:#ff9d9d}
.type-explore{color:#6fd8bf}
.type-check{color:#edc072}
.type-move{color:#9aa7bb}
.type-reward{color:#7ee08d}
.type-custom{color:#9aa7bb}
.add-step-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.add-step-row button{
  font-size:11px;padding:4px 10px;border-radius:15px;background:var(--panel-2);
  border:1px solid var(--line);color:var(--text-dim);
}
.add-step-row button:hover{border-color:var(--accent);color:var(--accent)}

/* 通用列表编辑 */
.sub-list{display:flex;flex-direction:column;gap:6px}
.sub-row{display:flex;gap:8px;align-items:center}
.hint-box{
  background:var(--panel-2);border:1px solid var(--line-soft);border-radius:8px;
  padding:9px 11px;font-size:11.5px;color:var(--text-faint);line-height:1.7;
}
.hint-box b{color:var(--text-dim)}
.hint-box code{font-family:var(--mono);font-size:11px;background:var(--bg);border:1px solid var(--line-soft);border-radius:4px;padding:1px 5px;color:var(--accent)}
.kbd{
  font-family:var(--mono);font-size:10.5px;background:var(--panel-3);border:1px solid var(--line);
  border-radius:4px;padding:1px 5px;color:var(--text-dim);
}

/* Toast */
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:7px;align-items:center}
.toast{
  background:var(--panel-2);border:1px solid var(--line);border-radius:9px;
  padding:8px 15px;font-size:12.5px;box-shadow:var(--shadow);animation:rise .2s;
  display:flex;align-items:center;gap:8px;max-width:620px;
}
.toast.err{border-color:rgba(240,96,96,.45);background:rgba(240,96,96,.1)}
.toast.ok{border-color:rgba(63,185,80,.4)}
.toast.warn{border-color:rgba(227,162,60,.4)}
@keyframes rise{from{opacity:0;transform:translateY(9px)}}

/* 冲突提示 */
.conflict{
  position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:300;
  background:rgba(227,162,60,.13);border:1px solid rgba(227,162,60,.45);
  border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:12px;
  box-shadow:var(--shadow);max-width:640px;
}
.conflict.hide{display:none}
.conflict .ct{font-size:12.5px}
.conflict .cd{font-size:11px;color:var(--text-faint);margin-top:2px}

.drop-mask{
  position:fixed;inset:0;background:rgba(91,157,255,.09);border:2px dashed var(--accent);
  z-index:500;display:flex;align-items:center;justify-content:center;font-size:15px;
  color:var(--accent);pointer-events:none;
}
.drop-mask.hide{display:none}
.spin{
  width:11px;height:11px;border:2px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:spin .7s linear infinite;display:inline-block;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ==========================================================================
   8. 灵感板（ADR-0007）
   ========================================================================== */
/* 灵感视图不是时间线的投影，它是一块独立的卡片墙，直接盖在画布上 */
.canvas-wrap.idea-mode > #grid,
.canvas-wrap.idea-mode > #world,
.canvas-wrap.idea-mode > #chipLayer,
.canvas-wrap.idea-mode > .cv-overlay,
.canvas-wrap.idea-mode > .canvas-empty{display:none}
.idea-board{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg-canvas);z-index:5}
.idea-board.hide{display:none}
.ib-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.ib-quick{
  flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-sm);
  color:var(--text);font-family:inherit;font-size:12.5px;padding:7px 11px;outline:none;
}
.ib-quick:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ib-sel{
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-sm);
  color:var(--text);font-family:inherit;font-size:12px;padding:7px 8px;outline:none;
}
.ib-filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line-soft)}
.ib-chip{
  border:1px solid var(--line);background:var(--panel-2);color:var(--text-dim);
  border-radius:999px;padding:3px 10px;font-size:11px;cursor:pointer;user-select:none;font-family:inherit;
}
.ib-chip:hover{color:var(--text);border-color:var(--text-faint)}
.ib-chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.ib-count{margin-left:auto;color:var(--text-faint);font-size:11px}
.ib-selbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--accent-soft);border-bottom:1px solid var(--line)}
.ib-scroll{flex:1;overflow-y:auto;padding:12px}
.ib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:10px;align-items:start}
.ib-card{
  position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:10px 11px 9px;cursor:pointer;transition:border-color .12s,transform .12s;
}
.ib-card:hover{border-color:var(--text-faint);transform:translateY(-1px)}
.ib-card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ib-card.merged{opacity:.45}
.ib-card.used{border-left:3px solid var(--ok)}
.ib-card .ibc-top{display:flex;align-items:flex-start;gap:6px;margin-bottom:5px}
.ib-card .ibc-title{flex:1;font-weight:600;font-size:12.5px;line-height:1.35;word-break:break-word}
.ib-card .ibc-text{
  color:var(--text-dim);font-size:11.5px;line-height:1.55;white-space:pre-wrap;
  word-break:break-word;max-height:150px;overflow:hidden;
}
.ib-card .ibc-foot{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:8px}
.ib-badge{font-size:10px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--text-faint);white-space:nowrap}
.ib-badge.k{background:rgba(91,157,255,.12);border-color:rgba(91,157,255,.3);color:#9dc0ff}
.ib-badge.s-used{background:rgba(63,185,80,.12);border-color:rgba(63,185,80,.35);color:#7ee08d}
.ib-badge.s-parked{background:rgba(227,162,60,.12);border-color:rgba(227,162,60,.35);color:#e3a23c}
.ib-badge.s-merged{background:rgba(176,124,255,.12);border-color:rgba(176,124,255,.35);color:#c9a6ff}
.ib-badge.tag{font-family:var(--mono)}
.ib-card .ibc-mark{
  position:absolute;top:-7px;right:-7px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--ok);color:#06170a;font-size:9.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.ib-empty{color:var(--text-faint);font-size:12px;text-align:center;padding:52px 24px;line-height:2}
.ib-pick{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--radius-sm);cursor:pointer}
.ib-pick:hover{background:var(--panel-2)}
.ib-pick .t{flex:1;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib-pick .d{color:var(--text-faint);font-size:11px;flex:0 0 auto}
.ib-facet-item{
  display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:var(--radius-sm);
  cursor:pointer;font-size:12px;color:var(--text-dim);user-select:none;
}
.ib-facet-item:hover{background:var(--panel-2);color:var(--text)}
.ib-facet-item.on{background:var(--accent-soft);color:var(--accent)}
.ib-facet-item .n{margin-left:auto;color:var(--text-faint);font-size:10.5px;font-family:var(--mono)}
.ib-origin{color:var(--text-faint);font-size:10.5px;line-height:1.7;margin-top:6px}
</style>
</head>
<body>

<div id="app">
  <!-- ============ 顶栏 ============ -->
  <header class="topbar">
    <div class="brand"><div class="brand-mark"></div><div class="brand-name">剧情框架</div></div>
    <input class="proj-name" id="projName" value="未命名工程" spellcheck="false" title="工程名称">
    <span class="pill" id="savePill"><i class="dot"></i><span id="saveText">未连接</span></span>

    <div class="tb-sep"></div>
    <div class="seg" id="viewSeg">
      <button data-view="timeline" class="on">时间线</button>
      <button data-view="character">角色</button>
      <button data-view="place">地点</button>
      <button data-view="ideas">灵感</button>
    </div>

    <div class="tb-sep"></div>
    <button class="tb-btn" id="btnUndo" title="撤销 (Ctrl+Z)">撤销</button>
    <button class="tb-btn" id="btnRedo" title="重做 (Ctrl+Shift+Z)">重做</button>

    <div class="tb-spacer"></div>

    <button class="tb-btn" id="btnAxes" title="显示/隐藏轴">轴</button>
    <button class="tb-btn" id="btnFit" title="适应视图 (F)">适应</button>
    <button class="tb-btn" id="btnExport" title="导出 JSON">导出</button>
    <button class="tb-btn" id="btnImport" title="导入 JSON">导入</button>
    <button class="tb-btn" id="btnSample" title="载入示例工程">示例</button>
    <button class="tb-btn" id="btnHelp" title="快捷键与说明">帮助</button>
  </header>

  <!-- ============ 左栏 ============ -->
  <aside class="leftbar side">
    <div class="side-scroll" id="leftScroll"></div>
  </aside>

  <!-- ============ 画布 ============ -->
  <main class="canvas-wrap" id="canvasWrap">
    <div id="grid"></div>
    <div id="world">
      <div id="axisLayer"></div>
      <svg id="svgLayer"><defs></defs><g id="gBands"></g><g id="gLinks"></g><g id="gEdges"></g><g id="gGhost"></g></svg>
      <div id="nodeLayer"></div>
    </div>
    <div id="chipLayer"></div>

    <div class="cv-overlay cv-tl">
      <div class="floating" id="addBar">
        <button id="btnAddEvent">+ 事件</button>
        <div class="vsep"></div>
        <button id="btnAddAxis">+ 轴</button>
        <div class="vsep"></div>
        <button id="btnLinkMode" title="点选两个事件以创建引用线 (Alt+拖拽亦可)">引用线</button>
      </div>
      <div class="legend" id="legend">
        <div class="li"><i style="border-color:#4d5b73"></i>依赖（解锁顺序）</div>
        <div class="li"><i style="border-color:var(--accent-2);border-top-style:dashed"></i>引用线（非强依赖）</div>
      </div>
    </div>

    <div class="cv-overlay cv-tr">
      <div class="floating">
        <button id="btnZoomOut" title="缩小">-</button>
        <div class="zoom-read" id="zoomRead">100%</div>
        <button id="btnZoomIn" title="放大">+</button>
        <div class="vsep"></div>
        <button id="btnFit2" title="适应视图">适应</button>
      </div>
    </div>

    <div class="cv-overlay cv-bl">
      <div class="cv-hint" id="cvHint">双击空白新建事件 · 拖拽空白平移 · Shift+拖拽空白框选 · 方向键微调</div>
    </div>

    <div class="canvas-empty" id="canvasEmpty">
      <h3>画布是空的</h3>
      <p>双击空白处创建第一个事件，或点击左上角「+ 轴」先定义一条时间逻辑。</p>
    </div>

    <!-- 灵感板：独立于画布的卡片墙，不是时间线的投影（ADR-0007） -->
    <div class="idea-board hide" id="ideaBoard">
      <div class="ib-head">
        <input class="ib-quick" id="ibQuick" placeholder="随手记一条灵感，回车即存…（留空则新建一条空灵感去右侧编辑）" spellcheck="false">
        <select class="ib-sel" id="ibKindSel"></select>
        <button class="btn primary sm" id="ibAdd">添加</button>
        <input class="ib-sel" id="ibSearch" placeholder="筛选…" spellcheck="false" style="width:150px">
      </div>
      <div class="ib-filters" id="ibFilters"></div>
      <div class="ib-selbar hide" id="ibSelBar"></div>
      <div class="ib-scroll" id="ibScroll"></div>
    </div>
  </main>

  <!-- ============ 右栏 ============ -->
  <aside class="rightbar side">
    <div class="side-scroll" id="inspector"></div>
  </aside>

  <!-- ============ AI 抽屉 ============ -->
  <section class="ai-drawer closed" id="aiDrawer">
    <div class="ai-head" id="aiHead">
      <span class="caret" id="aiCaret">▶</span>
      <span class="ttl">AI 协作</span>
      <span class="pill" id="aiPill"><i class="dot"></i><span id="aiPillText">未配置</span></span>
      <div class="tb-spacer"></div>
      <button class="tb-btn sm" id="btnAiConfig">会话与模型</button>
      <button class="tb-btn sm" id="btnAiClear">清空对话</button>
    </div>
    <div class="ai-body" id="aiBody"></div>
  </section>
</div>

<div class="conflict hide" id="conflictBar">
  <div>
    <div class="ct" id="conflictText">工程文件被外部修改</div>
    <div class="cd">可能是 AI 或编辑器改写了这个 JSON。请选择如何处理。</div>
  </div>
  <div class="tb-spacer"></div>
  <button class="btn sm" id="btnConflictTake">采纳外部版本</button>
  <button class="btn sm danger" id="btnConflictKeep">保留本地版本并覆盖</button>
</div>

<div class="mask hide" id="mask"></div>
<div id="toasts"></div>
<div class="drop-mask hide" id="dropMask">松开以载入工程 JSON</div>

<script type="module">
/* ============================================================================
   0 · 常量
   ========================================================================== */
const SCHEMA_VERSION = 1;
const BAND_H = 240000;                 // 轴色带世界高度，取足够大以在任何缩放下铺满视口
const MIN_ZOOM = 0.15, MAX_ZOOM = 3.2;
const UNDO_CAP = 80;

const KINDS  = { main: '主线', side: '支线' };
const TRIGGERS = { passive: '被动', active: '主动' };

/* 剧情步骤类型。通用工具，全部可自由增删；type 只是分类，字段是通用的。 */
const STEP_TYPES = {
  main:    { name: '对白',   color: 'type-main' },
  narr:    { name: '旁白',   color: 'type-narr' },

/* ============================================================================
   1 · 工具
   ========================================================================== */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

function uid(prefix) {
  return (prefix || 'x') + '_' + Math.random().toString(36).slice(2, 8);
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function debounce(fn, ms) {
  let t = null;
  return function () {
    const a = arguments, self = this;
    clearTimeout(t);
    t = setTimeout(() => fn.apply(self, a), ms);
  };
}
function el(tag, attrs, html) {
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'class') n.className = attrs[k];
    else if (k === 'style') n.style.cssText = attrs[k];
    else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] != null) n.setAttribute(k, attrs[k]);
  }
  if (html != null) n.innerHTML = html;
  return n;
}
function nowLabel() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
         ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
/* 极简 Markdown：够设定文本用，避免引入依赖 */
function mdLite(src) {
  let s = esc(src || '');
  s = s.replace(/```([\s\S]*?)```/g, (m, c) => '<pre><code>' + c.trim() + '</code></pre>');
  s = s.replace(/^#### (.*)$/gm, '<h4>$1</h4>').replace(/^### (.*)$/gm, '<h4>$1</h4>')
       .replace(/^## (.*)$/gm, '<h4>$1</h4>').replace(/^# (.*)$/gm, '<h4>$1</h4>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/^\s*[-*] (.*)$/gm, '<li>$1</li>');
  s = s.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, '<ul>$1</ul>');
  s = s.replace(/\n{2,}/g, '</p><p>');
  return '<p>' + s.replace(/\n/g, '<br>') + '</p>';
}
function toast(msg, kind, ms) {
  const box = $('#toasts');
  const n = el('div', { class: 'toast ' + (kind || '') }, esc(msg));
  box.appendChild(n);
  setTimeout(() => {
    n.style.transition = 'opacity .25s, transform .25s';
    n.style.opacity = '0';
    n.style.transform = 'translateY(-8px)';
    setTimeout(() => n.remove(), 260);
  }, ms || (kind === 'err' ? 6500 : 3000));
}
function confirmBox(msg) { return window.confirm(msg); }

   2 · 数据模型
   ========================================================================== */
function newProject(name) {
  const axId = uid('ax');
  return {
    schemaVersion: SCHEMA_VERSION,
    meta: { name: name || '未命名工程', updatedAt: nowLabel() },
    world: { brief: '', sections: [] },
    characters: [], places: [],
    axes: [{
      id: axId, name: '主线', color: AXIS_PALETTE[0], visible: true,
      brief: '这条轴跟踪故事的主干推进。',
      chapters: [{ id: uid('ch'), title: '第一章', brief: '', start: 0, end: 1000, children: [] }]
    }],
    events: [], edges: [], links: [], ideas: [],
    view: { camera: { x: 60, y: 120, zoom: 1 }, hiddenAxes: [] }
  };
}

function newEvent(t, y) {
  return {
    id: uid('ev'), title: '新事件',
    kind: 'side', trigger: 'passive',
    t: Math.round(t || 0), y: Math.round(y || 0),
    summary: '', brief: '',
    placeIds: [], characterIds: [], choices: [],
    scene: { steps: [] }, tags: [], color: ''
  };
}

/** 保证同层章节首尾相接、不留空隙（ADR-0006） */
function tileChapters(list, lo, hi) {
  let arr = (list || []).filter(c => c && typeof c.start === 'number' && typeof c.end === 'number');
  arr.sort((a, b) => a.start - b.start);
  arr = arr.filter(c => c.end > c.start);
  if (!arr.length) {
    arr = [{ id: uid('ch'), title: '章节', brief: '', start: lo, end: hi, children: [] }];
  }
  // 首尾对齐到给定范围，中间强制连续
  arr[0].start = Math.min(arr[0].start, lo);
  arr[arr.length - 1].end = Math.max(arr[arr.length - 1].end, hi);
  for (let i = 1; i < arr.length; i++) arr[i].start = arr[i - 1].end;
  for (const c of arr) {
    if (c.children && c.children.length) {
      c.children = tileChapters(c.children, c.start, c.end);
    }
    if (!c.children) c.children = [];
    if (!c.id) c.id = uid('ch');
    if (c.title == null) c.title = '';
    if (c.brief == null) c.brief = '';
  }
  return arr;
}

function normalize(p) {
  const base = newProject();
  if (!p || typeof p !== 'object') return base;
  p.schemaVersion = p.schemaVersion || SCHEMA_VERSION;
  p.meta = Object.assign({ name: '未命名工程', updatedAt: nowLabel() }, p.meta || {});
  p.world = Object.assign({ brief: '', sections: [] }, p.world || {});
  p.world.sections = (p.world.sections || []).map(s => ({
    id: s.id || uid('sec'), title: s.title || '', text: s.text || ''
  }));
  p.characters = (p.characters || []).map(c => ({
    id: c.id || uid('ch'), name: c.name || '未命名角色', aliases: c.aliases || [],
    color: c.color || '', brief: c.brief || '', tags: c.tags || []
  }));
  p.places = (p.places || []).map(c => ({
    id: c.id || uid('pl'), name: c.name || '未命名地点', parentId: c.parentId || '',
    color: c.color || '', brief: c.brief || '', tags: c.tags || []
  }));
  p.axes = (p.axes || []).map((a, i) => ({
    id: a.id || uid('ax'),
    name: a.name || ('轴 ' + (i + 1)),
    color: a.color || AXIS_PALETTE[i % AXIS_PALETTE.length],
    visible: a.visible !== false,
    brief: a.brief || '',
    chapters: tileChapters(a.chapters, 0, 1000)
  }));
  if (!p.axes.length) p.axes = base.axes;
  p.events = (p.events || []).map(e => ({
    id: e.id || uid('ev'), title: e.title || '未命名事件',
    kind: KINDS[e.kind] ? e.kind : 'side',
    trigger: TRIGGERS[e.trigger] ? e.trigger : 'passive',
    t: typeof e.t === 'number' ? e.t : 0,
    y: typeof e.y === 'number' ? e.y : 0,
    summary: e.summary || '', brief: e.brief || '',
    placeIds: (e.placeIds || []).filter(Boolean),
    characterIds: (e.characterIds || []).filter(Boolean),
    choices: (e.choices || []).map(c => ({ id: c.id || uid('op'), label: c.label || '', note: c.note || '' })),
    scene: { steps: ((e.scene && e.scene.steps) || []).map(s => ({
      id: s.id || uid('st'),
      type: STEP_TYPES[s.type] ? s.type : 'custom',
      fields: s.fields || {},
      children: s.children || []
    })) },
    tags: e.tags || [], color: e.color || ''
  }));
  const evIds = new Set(p.events.map(e => e.id));
  p.edges = (p.edges || []).filter(g => evIds.has(g.from) && evIds.has(g.to)).map(g => ({
    id: g.id || uid('ed'), from: g.from, to: g.to,
    viaChoiceId: g.viaChoiceId || '',
    requirements: (g.requirements || []).map(r => ({
      id: r.id || uid('rq'),
      type: REQ_TYPES[r.type] ? r.type : 'custom',
      key: r.key || '', value: r.value || '', note: r.note || ''
    })),
    note: g.note || ''
  }));
  p.links = (p.links || []).filter(g => evIds.has(g.from) && evIds.has(g.to)).map(g => {
    const type = LINK_TYPES[g.type] ? g.type : 'influence';
    return {
      id: g.id || uid('lk'), from: g.from, to: g.to, type: type,
      label: g.label || '', note: g.note || '',
      // 只有伏笔需要回收状态：open = 已埋设未回收，closed = 已回收
      state: type === 'foreshadow' ? (g.state === 'closed' ? 'closed' : 'open') : ''
    };
  });
  /* 灵感（ADR-0007）：独立集合。text 是原文，永不被改写；扩写与改写只追加到 expansion / variants；
     合并是软合并——被合并的条目保留在库里，只标记去向，因此可追溯也可反悔。 */
  p.ideas = (p.ideas || []).map(i => ({
    id: i.id || uid('id'),
    text: i.text || '',
    title: i.title || '',
    kind: IDEA_KINDS[i.kind] ? i.kind : 'note',
    tags: i.tags || [],
    characterIds: (i.characterIds || []).filter(Boolean),
    placeIds: (i.placeIds || []).filter(Boolean),
    status: IDEA_STATUS[i.status] ? i.status : 'raw',
    usedBy: (i.usedBy || []).filter(u => u && u.type).map(u => ({
      type: u.type, id: u.id || '', eventId: u.eventId || '', label: u.label || ''
    })),
    mergedInto: i.mergedInto || '',
    mergedFrom: (i.mergedFrom || []).filter(Boolean),
    expansion: i.expansion || '',
    variants: (i.variants || []).map(v => ({ id: v.id || uid('vr'), text: v.text || '', label: v.label || '' })),
    createdAt: i.createdAt || '',
    updatedAt: i.updatedAt || ''
  }));
  p.view = Object.assign({ camera: { x: 60, y: 120, zoom: 1 }, hiddenAxes: [] }, p.view || {});
  if (!p.view.camera) p.view.camera = { x: 60, y: 120, zoom: 1 };
  return p;
}

/* 便捷查询 */
const byId = (list, id) => (list || []).find(x => x.id === id) || null;
const eventById = id => byId(P.events, id);
const axisById  = id => byId(P.axes, id);
const charById  = id => byId(P.characters, id);
const placeById = id => byId(P.places, id);
const ideaById  = id => byId(P.ideas, id);

/** 灵感的显示名：优先短标题，否则取原文首行 */
function ideaTitle(i) {
  if (!i) return '';
  const t = (i.title || '').trim();
  if (t) return t;
  const first = (i.text || '').split('\n').map(s => s.trim()).filter(Boolean)[0] || '';
  return first.slice(0, 46) || '（空灵感）';
}
/** 合并后的条目留在库里但不再主动露面（ADR-0007：软合并） */
function ideaVisible(i) { return !!i && i.status !== 'merged'; }

function axisRange(axis) {
  const cs = axis.chapters;
  return cs.length ? [cs[0].start, cs[cs.length - 1].end] : [0, 1000];
}
/** 章节归属是派生的（ADR-0004）：由逻辑时间落在哪个区间决定 */
function chapterAt(axis, t) {
  const top = axis.chapters.find(c => t >= c.start && t < c.end) ||
              (axis.chapters.length ? axis.chapters[axis.chapters.length - 1] : null);
  if (!top) return { chapter: null, sub: null };
  const sub = (top.children || []).find(c => t >= c.start && t < c.end) || null;
  return { chapter: top, sub: sub };
}
function pathOfChapter(axis, chapterId) {
  for (const c of axis.chapters) {
    if (c.id === chapterId) return [c];
    for (const s of (c.children || [])) if (s.id === chapterId) return [c, s];
  }
  return null;
}
function deps(p) {
  const out = {}, inc = {};
  for (const e of P.events) { out[e.id] = []; inc[e.id] = []; }
  for (const g of P.edges) { if (out[g.from]) out[g.from].push(g); if (inc[g.to]) inc[g.to].push(g); }
  return { out, inc };
}

/* ============================================================================
   3 · 状态与撤销
   ========================================================================== */
let P = newProject();
const S = {
  selection: null,        // {type:'event'|'axis'|'chapter'|'character'|'place'|'world'|'edge'|'link', id}
  viewMode: 'timeline',   // timeline | character | place
  focusId: '',            // 角色/地点视图的焦点实体
  linkMode: false,        // 点选两节点创建引用线
  linkAnchor: '',
  connecting: null,       // {from, toX, toY, link:boolean}
  drag: null,
  camera: { x: 60, y: 120, zoom: 1 },
  session: { mode: 'direct', since: 0, es: null, connected: false },
  search: '', kindFilter: 'all', trigFilter: 'all',
  ideaFilter: { q: '', status: 'all', kind: 'all' },
  multi: new Set(),
  ai: { open: false, busy: false, messages: [], scope: 'neighbor', draft: null, autoApplied: [] }
};

let undoStack = [], redoStack = [];
let dragging = false;   // 拖拽中，用于抑制外部重载

function pushUndo() {
  undoStack.push(JSON.stringify(P));
  if (undoStack.length > UNDO_CAP) undoStack.shift();
  redoStack.length = 0;
  updateHistoryButtons();
}
function undo() {
  if (!undoStack.length) return;
  redoStack.push(JSON.stringify(P));
  P = JSON.parse(undoStack.pop());
  if (S.selection && !resolveSelection()) S.selection = null;
  updateHistoryButtons(); markDirty('撤销'); renderAll();
}
function redo() {
  if (!redoStack.length) return;
  undoStack.push(JSON.stringify(P));
  P = JSON.parse(redoStack.pop());
  if (S.selection && !resolveSelection()) S.selection = null;
  updateHistoryButtons(); markDirty('重做'); renderAll();
}
function updateHistoryButtons() {
  $('#btnUndo').disabled = !undoStack.length;
  $('#btnRedo').disabled = !redoStack.length;
}
function resolveSelection() {
  const s = S.selection;
  if (!s) return false;
  if (s.type === 'event')   return !!eventById(s.id);
  if (s.type === 'axis')    return !!axisById(s.id);
  if (s.type === 'character') return !!charById(s.id);
  if (s.type === 'place')   return !!placeById(s.id);
  if (s.type === 'edge')    return P.edges.some(g => g.id === s.id);
  if (s.type === 'link')    return P.links.some(g => g.id === s.id);
  if (s.type === 'chapter') return P.axes.some(a => pathOfChapter(a, s.id));
  return true;
}
function select(type, id) {
  // 选中灵感时顺带切到灵感视图，否则选中了也看不见它（agent 的 select 指令也走这条路）
  if (type === 'idea' && S.viewMode !== 'ideas') setView('ideas');
  if (type) S.selection = { type, id };
  else S.selection = null;
  if (S.viewMode === 'ideas') renderIdeasBoard(); else renderCanvas();
  renderInspector(); renderLeft(); renderAiStatus();
  reportSession();
}

/* ============================================================================
   4 · 持久化
   ========================================================================== */
const IO = {
  mode: 'offline',      // offline | server
  file: '',             // 工程文件名
  saveTimer: null,
  selfWriteUntil: 0,
  es: null,
  lastSavedAt: 0
};

async function probeServer() {
  try {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 1200);
    const r = await fetch('/api/health', { signal: ctl.signal });
    clearTimeout(timer);
    if (!r.ok) return false;
    const j = await r.json();
    return !!(j && j.ok);
  } catch (e) { return false; }
}

function setSavePill(kind, text) {
  const p = $('#savePill');
  p.className = 'pill ' + (kind || '');
  $('#saveText').textContent = text;
}

const markDirty = debounce(function (reason) {
  reportSession();
  if (IO.mode === 'server') saveToServer(reason);
  else {
    try { localStorage.setItem('plotstudio.backup', JSON.stringify(P)); } catch (e) {}
    setSavePill('warn', '本地草稿（未连接服务）');
  }
}, 600);

async function saveToServer() {
  if (IO.mode !== 'server' || !IO.file) return;
  const payload = clone(P);
  payload.meta.updatedAt = nowLabel();
  setSavePill('busy', '保存中');
  try {
    const r = await fetch('/api/project', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file: IO.file, data: payload })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
    P.meta.updatedAt = payload.meta.updatedAt;
    IO.selfWriteUntil = Date.now() + 1400;
    IO.lastSavedAt = Date.now();
    setSavePill('ok', '已保存 ' + new Date().toTimeString().slice(0, 5));
    renderProjMeta();
  } catch (e) {
    setSavePill('err', '保存失败');
    toast('保存失败：' + e.message, 'err');
  }
}

async function loadFromServer(file) {
  const r = await fetch('/api/project?file=' + encodeURIComponent(file));
  const text = await r.text();
  if (!r.ok) throw new Error(text.slice(0, 200));
  P = normalize(JSON.parse(text));
  IO.file = file;
  afterLoad();
  watchFile();
}

function afterLoad() {
  S.camera = P.view.camera || { x: 60, y: 120, zoom: 1 };
  S.selection = null;
  S.focusId = '';
  undoStack.length = 0; redoStack.length = 0;
  updateHistoryButtons();
  applyTransform();
  renderAll();
}

function watchFile() {
  if (IO.es) { IO.es.close(); IO.es = null; }
  if (IO.mode !== 'server' || !IO.file) return;
  const es = new EventSource('/api/watch?file=' + encodeURIComponent(IO.file));
  es.addEventListener('changed', async ev => {
    if (Date.now() < IO.selfWriteUntil) return;      // 自己刚写的，忽略
    if (dragging) { setTimeout(() => applyExternal(), 700); return; }
    applyExternal();
  });
  es.onerror = () => { /* EventSource 自带重连 */ };
  IO.es = es;
}

async function applyExternal() {
  const r = await fetch('/api/project?file=' + encodeURIComponent(IO.file));
  if (!r.ok) return;
  const text = await r.text();
  let next;
  try { next = JSON.parse(text); } catch (e) { return; }
  if (JSON.stringify(normalize(clone(next))) === JSON.stringify(P)) return;
  const keepSel = S.selection;
  P = normalize(next);
  if (keepSel && !resolveSelection()) S.selection = null;
  renderAll();
  toast('已同步工程文件的外部修改', 'ok', 2200);
}

function downloadJSON(filename, obj) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json;charset=utf-8' });
  const a = el('a', { href: URL.createObjectURL(blob), download: filename });
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
}

function pickLocalFile(accept, cb) {

/* ============================================================================
   5 · 视图变换
   ========================================================================== */
const NODE_W = 196;
let chipRefs = [];      // [{el, t}] 屏幕层章节标签，平移时只改 left

function applyTransform() {
  const c = S.camera;
  $('#world').style.transform = 'translate(' + c.x + 'px,' + c.y + 'px) scale(' + c.zoom + ')';
  const size = 32 * c.zoom;
  const g = $('#grid');
  g.style.backgroundSize = size + 'px ' + size + 'px';
  g.style.backgroundPosition = c.x + 'px ' + c.y + 'px';
  $('#zoomRead').textContent = Math.round(c.zoom * 100) + '%';
  P.view.camera = c;
  updateChipPositions();
}
function worldToScreenX(wx) { return wx * S.camera.zoom + S.camera.x; }
function worldToScreenY(wy) { return wy * S.camera.zoom + S.camera.y; }
function screenToWorld(sx, sy) {
  const r = $('#canvasWrap').getBoundingClientRect();
  return {
    x: (sx - r.left - S.camera.x) / S.camera.zoom,
    y: (sy - r.top - S.camera.y) / S.camera.zoom
  };
}
function zoomAt(sx, sy, factor) {
  const r = $('#canvasWrap').getBoundingClientRect();
  const px = sx - r.left, py = sy - r.top;
  const z0 = S.camera.zoom, z1 = clamp(z0 * factor, MIN_ZOOM, MAX_ZOOM);
  if (z1 === z0) return;
  const wx = (px - S.camera.x) / z0, wy = (py - S.camera.y) / z0;
  S.camera.zoom = z1;
  S.camera.x = px - wx * z1;
  S.camera.y = py - wy * z1;
  applyTransform();
  markDirty();
}
function fitView() {
  const box = $('#canvasWrap').getBoundingClientRect();
  if (!P.events.length) {
    S.camera = { x: 60, y: Math.max(140, box.height * 0.42), zoom: 1 };
    applyTransform(); markDirty(); return;
  }
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const e of P.events) {
    x0 = Math.min(x0, e.t); y0 = Math.min(y0, e.y);
    x1 = Math.max(x1, e.t + NODE_W); y1 = Math.max(y1, e.y + 110);
  }
  for (const a of P.axes) {
    if (!a.visible) continue;
    const r = axisRange(a);
    x0 = Math.min(x0, r[0]); x1 = Math.max(x1, r[1]);
  }
  const pad = 70;
  const z = clamp(Math.min((box.width - pad * 2) / Math.max(1, x1 - x0),
                           (box.height - pad * 2 - 90) / Math.max(1, y1 - y0)), 0.45, 1.4);
  S.camera.zoom = z;
  S.camera.x = pad - x0 * z + Math.max(0, (box.width - pad * 2 - (x1 - x0) * z) / 2);
  S.camera.y = 96 + pad - y0 * z + Math.max(0, (box.height - pad * 2 - 90 - (y1 - y0) * z) / 2);
  applyTransform(); markDirty();
}

/* ---- 焦点过滤：角色 / 地点视图都是一次投影，不持有独立数据（ADR-0004 同源原则） ---- */
function computeFocus() {
  if (S.viewMode === 'timeline' || !S.focusId) return { active: false, ids: null, label: '' };
  const hit = new Set();
  if (S.viewMode === 'character') {
    for (const e of P.events) if (e.characterIds.includes(S.focusId)) hit.add(e.id);
  } else {
    for (const e of P.events) if (e.placeIds.includes(S.focusId)) hit.add(e.id);
  }
  const ring = new Set(hit);
  for (const g of P.edges.concat(P.links)) {
    if (hit.has(g.from)) ring.add(g.to);
    if (hit.has(g.to)) ring.add(g.from);
  }
  const ent = S.viewMode === 'character' ? charById(S.focusId) : placeById(S.focusId);
  return { active: true, ids: ring, direct: hit, label: ent ? ent.name : '' };
}

function makeDivider(ax, parentChapter, t, level, index) {

function hexA(hex, a) {

   8 · 节点与连线

function renderNodes() {
  const focus = computeFocus();
  const layer = $('#nodeLayer');
  layer.innerHTML = '';
  const nodeEls = {};

  for (const ev of P.events) {
    const isSel = S.selection && S.selection.type === 'event' && S.selection.id === ev.id;
    const inMulti = S.multi.has(ev.id);
    const focused = focus.active && focus.ids.has(ev.id);
    const hidden = (focus.active && !focused) || !matchesFilter(ev);
    const n = el('div', {
      class: 'node k-' + ev.kind + (isSel ? ' sel' : '') + (inMulti ? ' multi' : '') +
             (hidden ? ' muted' : (focus.active && focused ? ' focus' : '')),
      style: 'left:' + ev.t + 'px;top:' + ev.y + 'px;' + (ev.color ? 'border-color:' + ev.color : '')
    });
    n.dataset.id = ev.id;

    const warn = warnFor(ev);
    const openHook = P.links.some(l => l.type === 'foreshadow' && l.state !== 'closed' && l.from === ev.id);
    const tagBits = [];
    tagBits.push('<span class="tag t-' + ev.kind + '">' + KINDS[ev.kind] + '</span>');
    tagBits.push('<span class="tag t-' + ev.trigger + '">' + TRIGGERS[ev.trigger] + '</span>');
    if (ev.scene.steps.length) tagBits.push('<span class="tag t-scene">剧情 ' + ev.scene.steps.length + '</span>');
    if (ev.choices.length) tagBits.push('<span class="tag t-scene">选项 ' + ev.choices.length + '</span>');
    for (const pid of ev.placeIds.slice(0, 1)) {
      const pl = placeById(pid); if (pl) tagBits.push('<span class="tag t-place">' + esc(pl.name) + '</span>');
    }
    if (ev.characterIds.length) {
      const c = charById(ev.characterIds[0]);
      if (c) tagBits.push('<span class="tag t-char">' + esc(c.name) +
        (ev.characterIds.length > 1 ? ' +' + (ev.characterIds.length - 1) : '') + '</span>');
    }

    n.innerHTML =
      '<div class="n-head"><span class="n-dot ' + ev.trigger + '"></span>' +
      '<div class="n-title">' + esc(ev.title) + '</div></div>' +
      (ev.summary ? '<div class="n-sum">' + esc(ev.summary) + '</div>' : '') +
      '<div class="n-foot">' + tagBits.join('') + '</div>' +
      (warn ? '<div class="n-warn" title="' + esc(warn) + '">!</div>' : '') +
      (openHook ? '<div class="n-hook" title="这里埋了伏笔，还没有回收">伏</div>' : '') +
      '<div class="handle l" title="从此处拖出以连接前驱"></div>' +
      '<div class="handle r" title="从此处拖出以连接后继（按住 Alt 创建引用线）"></div>';

    onDown(n, onNodePointerDown);
    n.addEventListener('dblclick', e => { e.stopPropagation(); openSceneEditor(ev.id); });
    layer.appendChild(n);
    nodeEls[ev.id] = n;
  }

  // 先布局后取尺寸，再画线，端点才能贴合节点卡片
  const rects = {};
  for (const id in nodeEls) {
    const e2 = nodeEls[id];
    rects[id] = { x: e2.offsetLeft, y: e2.offsetTop, w: e2.offsetWidth, h: e2.offsetHeight };
  }
  drawEdges(rects, focus);
  $('#canvasEmpty').style.display = P.events.length ? 'none' : 'flex';
}
function warnFor(ev) {
  const msgs = [];
  const outs = P.edges.filter(g => g.from === ev.id);
  if (ev.choices.length) {
    for (const c of ev.choices) if (!outs.some(g => g.viaChoiceId === c.id)) msgs.push('选项「' + c.label + '」没有后继');
  }
  const hasAny = outs.length || P.edges.some(g => g.to === ev.id) || P.links.some(g => g.from === ev.id || g.to === ev.id);
  if (!hasAny) msgs.push('孤立事件：没有任何依赖或引用');
  if (ev.kind === 'main' && !P.edges.some(g => g.to === ev.id) && P.events.length > 1) msgs.push('主线事件没有前驱');
  return msgs.join('；');
}
function drawEdges(rects, focus) {
  const gEdges = $('#gEdges'), gLinks = $('#gLinks');
  gEdges.innerHTML = ''; gLinks.innerHTML = '';
  const R = id => rects[id] || { x: 0, y: 0, w: NODE_W, h: 60 };
  const hot = id => S.selection && ((S.selection.type === 'event' && S.selection.id === id) ||
                                    (S.selection.type === 'edge' && S.selection.id === id));

  const mk = (cls, d, marker, attrs) => {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', d); p.setAttribute('class', cls);
    if (marker) p.setAttribute('marker-end', 'url(#' + marker + ')');
    if (attrs) for (const k in attrs) p.setAttribute(k, attrs[k]);
    return p;
  };

  for (const lk of P.links) {
    const a = R(lk.from), b = R(lk.to);
    const d = curve(a.x + a.w / 2, a.y + a.h / 2, b.x + b.w / 2, b.y + b.h / 2, -70, 0.5);
    const on = hot(lk.from) || hot(lk.to) || (S.selection && S.selection.type === 'link' && S.selection.id === lk.id);
    const openF = lk.type === 'foreshadow' && lk.state !== 'closed';
    gLinks.appendChild(mk('edge edge-link' + (openF ? ' open' : '') + (on ? ' hot' : ''), d, 'arrowLink'));
    const hit = mk('edge-hit', d); hit.style.pointerEvents = 'stroke';
    hit.addEventListener('click', e => { e.stopPropagation(); select('link', lk.id); });
    hit.addEventListener('dblclick', e => { e.stopPropagation(); select('link', lk.id); });
    gLinks.appendChild(hit);
    const mid = curvePoint(a.x + a.w / 2, a.y + a.h / 2, b.x + b.w / 2, b.y + b.h / 2, -70, 0.5);
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', mid.x); t.setAttribute('y', mid.y); t.setAttribute('class', 'edge-label');
    t.setAttribute('text-anchor', 'middle');
    t.textContent = (lk.label || LINK_TYPES[lk.type].name) + (openF ? ' · 未回收' : '');
    gLinks.appendChild(t);
  }

  for (const g of P.edges) {
    const a = R(g.from), b = R(g.to);
    const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2;
    const bow = S.selection && S.selection.type === 'event' &&
                (S.selection.id === g.from || S.selection.id === g.to) ? 0 : 0;
    const d = curve(x1, y1, x2, y2, bow, 0.42);
    const isHot = hot(g.from) || hot(g.to);
    gEdges.appendChild(mk('edge edge-dep' + (isHot ? ' hot' : ''), d, isHot ? 'arrowDepHot' : 'arrowDep'));
    const hit = mk('edge-hit', d); hit.style.pointerEvents = 'stroke';
    hit.addEventListener('click', e => { e.stopPropagation(); select('edge', g.id); });
    gEdges.appendChild(hit);
    const bits = [];
    if (g.viaChoiceId) {
      const src = eventById(g.from);
      const ch = src ? src.choices.find(c => c.id === g.viaChoiceId) : null;
      bits.push('「' + ((ch && ch.label) || '已删除选项') + '」');
    }
    if (g.requirements.length) {
      const names = g.requirements.map(r => (REQ_TYPES[r.type] ? REQ_TYPES[r.type].name : '条件') + ':' + (r.key || '—'));
      bits.push('⛓ ' + names.join('，'));
    }
    if (bits.length) {
      const mid = curvePoint(x1, y1, x2, y2, bow, 0.42);
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', mid.x); t.setAttribute('y', mid.y - 4);
      t.setAttribute('class', 'edge-label'); t.setAttribute('text-anchor', 'middle');
      t.textContent = bits.join(' · ');
      gEdges.appendChild(t);
    }
  }
  // 拖拽中的幽灵线
  const gGhost = $('#gGhost'); gGhost.innerHTML = '';
  if (S.connecting) {
    const a = R(S.connecting.from);
    const d = curve(a.x + a.w, a.y + a.h / 2, S.connecting.toX, S.connecting.toY, 0, 0.42);
    gGhost.appendChild(mk('edge edge-ghost', d, null));
  }
}
function curve(x1, y1, x2, y2, bow, k) {
  const dx = Math.max(46, Math.abs(x2 - x1) * k);
  const my = (y1 + y2) / 2 + bow;
  return 'M' + x1 + ',' + y1 + ' C' + (x1 + dx) + ',' + y1 + ' ' + (x2 - dx) + ',' + y2 + ' ' + x2 + ',' + y2;
}
function curvePoint(x1, y1, x2, y2, bow, t) {
  const dx = Math.max(46, Math.abs(x2 - x1) * 0.42);
  const p0 = { x: x1, y: y1 }, p1 = { x: x1 + dx, y: y1 },
        p2 = { x: x2 - dx, y: y2 }, p3 = { x: x2, y: y2 };
  const mt = 1 - t;
  return {
    x: mt * mt * mt * p0.x + 3 * mt * mt * t * p1.x + 3 * mt * t * t * p2.x + t * t * t * p3.x,
    y: mt * mt * mt * p0.y + 3 * mt * mt * t * p1.y + 3 * mt * t * t * p2.y + t * t * t * p3.y
  };
}
function initArrowDefs() {
  const defs = $('#svgLayer defs');
  defs.innerHTML =
    '<marker id="arrowDep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">' +
      '<path d="M0,0 L10,5 L0,10 z" class="arrow-head"/></marker>' +
    '<marker id="arrowDepHot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">' +
      '<path d="M0,0 L10,5 L0,10 z" class="arrow-head hot"/></marker>' +
    '<marker id="arrowLink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">' +
      '<path d="M0,0 L10,5 L0,10 z" class="arrow-head-link"/></marker>';
