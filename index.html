/* ============================================================================
   9 · 交互：节点拖拽与连线
   ========================================================================== */
const MINW = 12;

/* 事件兼容层。
   同时支持 Pointer Events 与 Mouse Events：鼠标走 mousedown / mousemove / mouseup，
   触摸与手写笔走 pointer 系列。只绑 pointer 系列在部分嵌入环境或自动化工具里会完全失灵，
   两套都绑又会重复触发，所以用 pointerType 做分流——鼠标的 pointer 事件一律让给 mouse 事件处理。
   函数返回解绑函数。 */
function onDown(target, handler) {
  target.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') handler(e); });
  target.addEventListener('mousedown', handler);
}
function onWindowMove(handler) {
  const pm = e => { if (e.pointerType === 'mouse') return; handler(e); };
  window.addEventListener('pointermove', pm);
  window.addEventListener('mousemove', handler);
  return function () { window.removeEventListener('pointermove', pm); window.removeEventListener('mousemove', handler); };
}
function onWindowUp(handler) {
  const pu = e => { if (e.pointerType === 'mouse') return; handler(e); };
  window.addEventListener('pointerup', pu);
  window.addEventListener('mouseup', handler);
  return function () { window.removeEventListener('pointerup', pu); window.removeEventListener('mouseup', handler); };
}

function onNodePointerDown(e) {
  if (e.button !== 0) return;
  const nodeEl = e.currentTarget;
  const id = nodeEl.dataset.id;
  const ev = eventById(id);
  if (!ev) return;
  e.stopPropagation();

  const handle = e.target.classList && e.target.classList.contains('handle') ? e.target : null;
  if (handle) { startConnecting(ev, handle.classList.contains('l') ? 'l' : 'r', e); return; }

  // Shift 点击 = 加选 / 取消加选
  if (e.shiftKey) {
    if (S.multi.has(id)) S.multi.delete(id); else S.multi.add(id);
    S.selection = { type: 'event', id: id };
    renderCanvas(); renderInspector(); renderLeft();
    return;
  }
  // 普通点击把加选收敛为单选
  if (S.multi.size) { S.multi.clear(); renderLeft(); }

  if (S.linkMode) { selectQuiet('event', id); handleLinkClick(id); return; }

  const start = screenToWorld(e.clientX, e.clientY);
  const o = { t: ev.t, y: ev.y };
  let moved = false;
  pushUndo();
  dragging = true;
  // 注意：这里只做就地选中，不能整块重渲染，否则正在被按住的节点元素会被销毁，拖拽就断了
  selectQuiet('event', id);
  nodeEl.classList.add('dragging');

  const offMove = onWindowMove(me => {
    const w = screenToWorld(me.clientX, me.clientY);
    let nt = o.t + (w.x - start.x), ny = o.y + (w.y - start.y);
    // Ctrl 拖动 = 锁定单轴移动
    if (me.ctrlKey) { if (Math.abs(nt - o.t) > Math.abs(ny - o.y)) ny = o.y; else nt = o.t; }
    ev.t = Math.round(nt); ev.y = Math.round(ny);
    for (const id of S.multi) {
      if (id === ev.id) continue;
      const other = document.querySelector('#nodeLayer .node[data-id="' + id + '"]');
      const oe = eventById(id);
      if (other && oe) { oe.t = Math.round(o.t + (w.x - start.x)); oe.y = Math.round(o.y + (w.y - start.y)); other.style.left = oe.t + 'px'; other.style.top = oe.y + 'px'; }
    }
    nodeEl.style.left = ev.t + 'px'; nodeEl.style.top = ev.y + 'px';
    if (Math.abs(nt - o.t) > 1 || Math.abs(ny - o.y) > 1) moved = true;
    redrawEdgesOnly();
    renderInspectorLight();
  });
  const offUp = onWindowUp(() => {
    offMove(); offUp();
    dragging = false;
    nodeEl.classList.remove('dragging');
    if (!moved) { undoStack.pop(); updateHistoryButtons(); }
    else { markDirty(); renderLeft(); renderInspector(); }
  });
}

/** 就地选中：只改选中样式与两侧面板，不动节点 DOM，保证拖拽中的元素不被替换 */
function selectQuiet(type, id) {
  S.selection = { type: type, id: id };
  $$('#nodeLayer .node').forEach(n => n.classList.toggle('sel', n.dataset.id === id));
  renderInspector();
  renderLeft();
  renderAiStatus();
  redrawEdgesOnly();
}

function redrawEdgesOnly() {
  const rects = {};
  $$('#nodeLayer .node').forEach(n => {
    rects[n.dataset.id] = { x: n.offsetLeft, y: n.offsetTop, w: n.offsetWidth, h: n.offsetHeight };
  });
  drawEdges(rects, null);
}

function startConnecting(ev, side, e) {
  e.stopPropagation();
  pushUndo();
  dragging = true;
  S.connecting = { from: ev.id, side: side, toX: ev.t + (side === 'r' ? NODE_W : 0), toY: ev.y + 30, link: !!e.altKey || S.linkMode };
  const offMove = onWindowMove(me => {
    const w = screenToWorld(me.clientX, me.clientY);
    S.connecting.toX = w.x; S.connecting.toY = w.y;
    S.connecting.link = !!me.altKey || S.linkMode;
    redrawEdgesOnly();
  });
  const offUp = onWindowUp(me => {
    offMove(); offUp();
    dragging = false;
    const over = document.elementFromPoint(me.clientX, me.clientY);
    const tgt = over && over.closest ? over.closest('.node') : null;
    const targetId = tgt ? tgt.dataset.id : '';
    const link = !!me.altKey || S.linkMode;
    S.connecting = null;
    if (!targetId || targetId === ev.id) { undoStack.pop(); updateHistoryButtons(); renderCanvas(); return; }
    if (side === 'r') connect(ev.id, targetId, link);
    else connect(targetId, ev.id, link);
  });
  renderCanvas();
}

function connect(fromId, toId, link) {
  if (fromId === toId) return;
  if (link) {
    if (P.links.some(g => g.from === fromId && g.to === toId)) { toast('这条引用线已存在'); return; }
    P.links.push({ id: uid('lk'), from: fromId, to: toId, type: 'influence', label: '', note: '' });
    toast('已创建引用线', 'ok');
  } else {
    if (P.edges.some(g => g.from === fromId && g.to === toId)) { toast('这条依赖已存在'); return; }
    const g = { id: uid('ed'), from: fromId, to: toId, viaChoiceId: '', requirements: [], note: '' };
    P.edges.push(g);
    const src = eventById(fromId);
    S.selection = { type: 'edge', id: g.id };
    toast('已创建依赖' + (src && src.choices.length ? '（可在右侧指定由哪个选项触发）' : ''), 'ok');
  }
  undoStack.pop();
  pushUndo();
  markDirty();
  renderAll();
}

/* 引用线模式的点选两下 */
function handleLinkClick(id) {
  if (!S.linkAnchor) { S.linkAnchor = id; toast('已选择起点，再点一个事件作为终点'); renderCanvas(); return; }
  if (S.linkAnchor === id) { S.linkAnchor = ''; renderCanvas(); return; }
  const a = S.linkAnchor; S.linkAnchor = '';
  pushUndo();
  connect(a, id, true);
}

/* ============================================================================
   10 · 交互：分割线拖拽与章节切分
   ========================================================================== */
function startDividerDrag(e) {
  if (e.button !== 0) return;
  e.stopPropagation();
  const axisId = e.currentTarget.dataset.axis;
  const parentId = e.currentTarget.dataset.parent;
  const idx = Number(e.currentTarget.dataset.index);
  const ax = axisById(axisId);
  if (!ax) return;
  const parent = parentId ? pathOfChapter(ax, parentId)[0] : null;
  const list = parent ? (parent.children || []) : ax.chapters;
  if (list.length < 2 && !parent) { /* 单章节时仍然可拖左右两端 */ }
  pushUndo();
  dragging = true;

  const offMove = onWindowMove(me => {
    const t = screenToWorld(me.clientX, me.clientY).x;
    if (parent) {
      if (idx <= 0 || idx >= list.length) return;      // 子章节外侧边界锁定在父章节范围内
      const a = list[idx - 1], b = list[idx];
      const v = clamp(t, a.start + MINW, b.end - MINW);
      a.end = v; b.start = v;
    } else {
      if (idx <= 0) {
        list[0].start = Math.min(t, list[0].end - MINW);
      } else if (idx >= list.length) {
        list[list.length - 1].end = Math.max(t, list[list.length - 1].start + MINW);
      } else {
        const a = list[idx - 1], b = list[idx];
        const v = clamp(t, a.start + MINW, b.end - MINW);
        a.end = v; b.start = v;
      }
      for (const c of ax.chapters) clampChildren(c);
    }
    renderAxisLayer(); renderCanvas();
  });
  const offUp = onWindowUp(() => {
    offMove(); offUp();
    dragging = false;
    markDirty(); renderInspector(); renderLeft();
  });
}

function clampChildren(parent) {
  const kids = parent.children || [];
  if (!kids.length) return;
  kids.sort((a, b) => a.start - b.start);
  kids[0].start = parent.start;
  kids[kids.length - 1].end = parent.end;
  for (let i = 1; i < kids.length; i++) kids[i].start = kids[i - 1].end;
  parent.children = kids.filter(k => k.end > k.start);
}

/** 在某处切一刀，两侧即两个章节（分割线是唯一的创建方式） */
function splitAt(axisId, parentId, t) {
  const ax = axisById(axisId);
  if (!ax) return;
  const parent = parentId ? pathOfChapter(ax, parentId)[0] : null;
  const list = parent ? parent.children : ax.chapters;
  let i = list.findIndex(c => t > c.start + MINW && t < c.end - MINW);
  if (i < 0) { toast('请在章节内部切分（离边界太近）', 'warn'); return; }
  pushUndo();
  const cur = list[i];
  const right = { id: uid('ch'), title: '新章节', brief: '', start: t, end: cur.end, children: [] };
  cur.end = t;
  if (cur.children && cur.children.length) {
    const left = [], rt = [];
    for (const c of cur.children) {
      if (c.end <= t) left.push(c);
      else if (c.start >= t) rt.push(c);
      else {
        const c2 = clone(c); c2.id = uid('ch');
        c.end = t; c2.start = t;
        c.children = [];
        left.push(c); rt.push(c2);
      }
    }
    cur.children = left; right.children = rt;
  }
  list.splice(i + 1, 0, right);
  if (parent) clampChildren(parent);
  markDirty();
  S.selection = { type: 'chapter', id: right.id };
  renderAll();
  toast('已切出新章节', 'ok');
}

/* ============================================================================
   11 · 画布：平移 / 缩放 / 新建
   ========================================================================== */
function initCanvasInteractions() {
  const wrap = $('#canvasWrap');

  onDown(wrap, e => {
    if (e.button !== 0 && e.button !== 1) return;
    if (e.target.closest('.node') || e.target.closest('.divider') || e.target.closest('.chip') ||
        e.target.closest('.axis-tag') || e.target.closest('.floating') || e.target.closest('.legend') ||
        e.target.closest('.edge-hit') || e.target.closest('.cv-hint')) return;

    const marquee = e.shiftKey && e.button === 0;
    const origin = { x: e.clientX, y: e.clientY, cx: S.camera.x, cy: S.camera.y };
    let moved = false, last = { x: e.clientX, y: e.clientY };
    let box = null;
    if (marquee) {
      e.preventDefault();
      box = el('div', { class: 'marquee' });
      wrap.appendChild(box);
      wrap.style.cursor = 'crosshair';
    } else {
      wrap.style.cursor = 'grabbing';
    }

    const offMove = onWindowMove(me => {
      last = { x: me.clientX, y: me.clientY };
      const dx = me.clientX - origin.x, dy = me.clientY - origin.y;
      if (Math.abs(dx) > 2 || Math.abs(dy) > 2) moved = true;
      if (marquee) {
        const r = wrap.getBoundingClientRect();
        box.style.left = (Math.min(origin.x, me.clientX) - r.left) + 'px';
        box.style.top = (Math.min(origin.y, me.clientY) - r.top) + 'px';
        box.style.width = Math.abs(dx) + 'px';
        box.style.height = Math.abs(dy) + 'px';
      } else {
        S.camera.x = origin.cx + dx;
        S.camera.y = origin.cy + dy;
        applyTransform();
      }
    });
    // 必须经 onWindowUp 注册到 window 上，否则松开鼠标时没有任何东西去结束拖动
    const offUp = onWindowUp(() => {
      offMove(); offUp();
      wrap.style.cursor = '';
      if (marquee) {
        if (box) box.remove();
        selectInBox(origin.x, origin.y, last.x, last.y);
        return;
      }
      if (moved) markDirty();
      else { S.multi.clear(); select(null); }
    });
  });

  wrap.addEventListener('wheel', e => {
    e.preventDefault();
    if (e.shiftKey) {
      S.camera.x -= e.deltaY;
      applyTransform();
      markDirty();
      return;
    }
    zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.12 : 1 / 1.12);
  }, { passive: false });

  wrap.addEventListener('dblclick', e => {
    if (e.target.closest('.node') || e.target.closest('.divider') || e.target.closest('.chip') ||
        e.target.closest('.axis-tag') || e.target.closest('.floating')) return;
    const w = screenToWorld(e.clientX, e.clientY);
    createEventAt(w.x, w.y);
  });
}

/* 框选：把中心点落在矩形内的事件加入加选集合 */
function selectInBox(x1, y1, x2, y2) {
  const a = screenToWorld(Math.min(x1, x2), Math.min(y1, y2));
  const b = screenToWorld(Math.max(x1, x2), Math.max(y1, y2));
  const hit = P.events.filter(ev => {
    const cx = ev.t + NODE_W / 2, cy = ev.y + 26;
    return cx >= a.x && cx <= b.x && cy >= a.y && cy <= b.y;
  });
  S.multi = new Set(hit.map(x => x.id));
  S.selection = hit.length ? { type: 'event', id: hit[0].id } : null;
  renderCanvas(); renderInspector(); renderLeft();
  if (hit.length) toast('已框选 ' + hit.length + ' 个事件', 'ok', 1600);
}

function createEventAt(x, y) {
  pushUndo();
  const ev = newEvent(x, y);
  const { chapter } = P.axes[0] ? chapterAt(P.axes[0], x) : { chapter: null };
  ev.title = '新事件';
  P.events.push(ev);
  markDirty();
  S.selection = { type: 'event', id: ev.id };
  renderAll();
  renderInspector();
  setTimeout(() => { const t = $('#f-title'); if (t) { t.focus(); t.select(); } }, 30);
}

/* ============================================================================
   12 · 键盘
   ========================================================================== */
function initKeyboard() {
  window.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    const editing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;

    if (e.ctrlKey && !e.shiftKey && e.key.toLowerCase() === 'z') { if (!editing) { e.preventDefault(); undo(); } return; }
    if (e.ctrlKey && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z'))) {
      if (!editing) { e.preventDefault(); redo(); } return;
    }
    if (e.ctrlKey && e.key.toLowerCase() === 's') { e.preventDefault(); saveToServer(); toast('已保存', 'ok', 1200); return; }
    if (editing) { if (e.key === 'Escape') e.target.blur(); return; }
    const stp = e.shiftKey ? 10 : 1;
    const ARROWS = { ArrowLeft: [-stp, 0], ArrowRight: [stp, 0], ArrowUp: [0, -stp], ArrowDown: [0, stp] };
    if (ARROWS[e.key] && (S.selection || S.multi.size)) {
      // 灵感没有空间位置，方向键与它无关（多选里装的是灵感 id，微调会白跑一趟）
      if (S.viewMode === 'ideas') return;
      e.preventDefault();
      nudgeSelection(ARROWS[e.key][0], ARROWS[e.key][1]);
      return;
    }
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelection(); return; }
    if (e.key === 'f' || e.key === 'F') {
      if (S.viewMode === 'ideas') return;
      fitView(); return;
    }
    if (e.key === 'a' && e.ctrlKey) {
      e.preventDefault();
      if (S.viewMode === 'ideas') {
        // 全选"当前筛选出来的"灵感，方便一次性合并
        S.multi = new Set(filteredIdeas().map(x => x.id));
        renderIdeasBoard(); renderInspector();
      } else {
        S.multi = new Set(P.events.map(x => x.id));
        renderCanvas(); renderLeft(); renderInspector();
      }
      return;
    }
    if (e.key === 'Escape') {
      S.linkMode = false; S.linkAnchor = ''; S.connecting = null;
      S.multi.clear();
      $('#btnLinkMode').classList.remove('on');
      closeMask(); renderAll(); return;
    }
    if (e.key === ' ') { e.preventDefault(); }
  });
}

/** 当前被选中的事件 id：优先加选集合，否则单选 */
function selectedEventIds() {
  if (S.multi.size) return Array.from(S.multi);
  const s = S.selection;
  return s && s.type === 'event' ? [s.id] : [];
}
/** 方向键微调：水平改逻辑时间，竖直改自由位置 */
function nudgeSelection(dt, dy) {
  const ids = selectedEventIds();
  if (!ids.length) return;
  pushUndo();
  for (const id of ids) {
    const ev = eventById(id);
    if (!ev) continue;
    ev.t += dt; ev.y += dy;
    const n = document.querySelector('#nodeLayer .node[data-id="' + id + '"]');
    if (n) { n.style.left = ev.t + 'px'; n.style.top = ev.y + 'px'; }
  }
  redrawEdgesOnly();
  renderInspectorLight();
  markDirty();
  renderLeft();
}

function deleteSelection() {
  // 灵感视图下删除的是灵感，与事件无关，走单独一条路
  if (S.viewMode === 'ideas') return deleteIdeas();
  // 加选模式下批量删除
  if (S.multi.size) {
    const n = S.multi.size;
    pushUndo();
    P.events = P.events.filter(x => !S.multi.has(x.id));
    P.edges = P.edges.filter(g => !S.multi.has(g.from) && !S.multi.has(g.to));
    P.links = P.links.filter(g => !S.multi.has(g.from) && !S.multi.has(g.to));
    S.multi.clear();
    S.selection = null;
    markDirty(); renderAll();
    toast('已删除 ' + n + ' 个事件及其连线');
    return;
  }
  const s = S.selection;
  if (!s) return;
  pushUndo();
  if (s.type === 'event') {
    P.events = P.events.filter(x => x.id !== s.id);
    P.edges = P.edges.filter(g => g.from !== s.id && g.to !== s.id);
    P.links = P.links.filter(g => g.from !== s.id && g.to !== s.id);
    toast('已删除事件及其全部连线');
  } else if (s.type === 'edge') {
    P.edges = P.edges.filter(g => g.id !== s.id);
  } else if (s.type === 'link') {
    P.links = P.links.filter(g => g.id !== s.id);
  } else if (s.type === 'character') {
    P.characters = P.characters.filter(x => x.id !== s.id);
    P.events.forEach(ev => ev.characterIds = ev.characterIds.filter(i => i !== s.id));
  } else if (s.type === 'place') {
    P.places = P.places.filter(x => x.id !== s.id);
    P.events.forEach(ev => ev.placeIds = ev.placeIds.filter(i => i !== s.id));
  } else if (s.type === 'axis') {
    P.axes = P.axes.filter(x => x.id !== s.id);
    if (!P.axes.length) P.axes = newProject().axes;
  } else if (s.type === 'chapter') {
    for (const ax of P.axes) {
      const p = pathOfChapter(ax, s.id);
      if (!p) continue;
      if (p.length === 2) {
        const parent = p[0], kids = parent.children;
        if (kids.length <= 1) { undoStack.pop(); updateHistoryButtons(); toast('至少要保留一个子章节', 'warn'); return; }
        const i = kids.findIndex(k => k.id === s.id);
        kids.splice(i, 1);
        clampChildren(parent);
      } else {
        if (ax.chapters.length <= 1) { undoStack.pop(); updateHistoryButtons(); toast('至少要保留一个章节', 'warn'); return; }
        const i = ax.chapters.findIndex(k => k.id === s.id);
        ax.chapters.splice(i, 1);
        if (i === 0) ax.chapters[0].start = p[0].start;
        if (i === ax.chapters.length) ax.chapters[ax.chapters.length - 1].end = p[0].end;
        for (const c of ax.chapters) clampChildren(c);
      }
      break;
    }
  } else { undoStack.pop(); updateHistoryButtons(); return; }
  S.selection = null;
  markDirty();
  renderAll();
}

/* ============================================================================
   13 · 左栏
   ========================================================================== */
const collapsed = { world: false, axes: false, chars: false, places: false, events: false, stats: true };

function makeSection(key, title, count, onAdd, addTitle) {
  const s = el('div', { class: 'section' + (collapsed[key] ? ' collapsed' : '') });
  const h = el('div', { class: 'sec-head' },
    '<span class="caret">▼</span><span>' + esc(title) + '</span>' +
    (count != null ? '<span class="count">' + count + '</span>' : '') +
    (onAdd ? '<span class="add" title="' + esc(addTitle || '新增') + '">+</span>' : ''));
  h.addEventListener('click', e => {
    if (e.target.classList.contains('add')) { e.stopPropagation(); onAdd(); return; }
    collapsed[key] = !collapsed[key];
    h.parentNode.classList.toggle('collapsed', collapsed[key]);
  });
  s.appendChild(h);
  s.appendChild(el('div', { class: 'sec-body' }));
  return s;
}
function body(s) { return s.querySelector('.sec-body'); }

function rowItem(label, opts) {
  opts = opts || {};
  const r = el('div', { class: 'row' + (opts.sel ? ' sel' : '') + (opts.dim ? ' dim' : '') });
  if (opts.color) r.appendChild(el('span', { class: 'swatch', style: 'background:' + opts.color }));
  r.appendChild(el('span', { class: 'label' }, esc(label)));
  if (opts.sub) r.appendChild(el('span', { class: 'sub' }, esc(opts.sub)));
  if (opts.eyeFn) {
    const b = el('span', { class: 'eye', title: '显示 / 隐藏这条轴' }, opts.eyeOn ? '◉' : '○');
    b.addEventListener('click', e => { e.stopPropagation(); opts.eyeFn(); });
    r.appendChild(b);
  }
  if (opts.kill) {
    const b = el('span', { class: 'kill', title: '删除' }, '×');
    b.addEventListener('click', e => { e.stopPropagation(); opts.kill(); });
    r.appendChild(b);
  }
  if (opts.onClick) r.addEventListener('click', opts.onClick);
  return r;
}
function isSel(type, id) { return S.selection && S.selection.type === type && S.selection.id === id; }

function renderLeft() {
  const host = $('#leftScroll');
  if (!host) return;
  // 左栏里有搜索框，重建后要把焦点与光标位置还原，否则每敲一个字就断
  const act = document.activeElement;
  const keepId = act && host.contains(act) && act.id ? act.id : '';
  const caret = keepId && typeof act.selectionStart === 'number' ? act.selectionStart : 0;
  host.innerHTML = '';

  if (S.viewMode === 'ideas') { renderIdeaLeft(host); return; }

  if (S.viewMode !== 'timeline') {
    const focus = computeFocus();
    const box = el('div', { class: 'hint-box', style: 'margin:10px;border-color:rgba(91,157,255,.3)' },
      '<b>' + (S.viewMode === 'character' ? '角色视图' : '地点视图') + '</b><br>' +
      (S.focusId
        ? '正在聚焦「' + esc(focus.label) + '」，画布上无关事件已淡出。下方列表可切换焦点。'
        : '请选择下方一个' + (S.viewMode === 'character' ? '角色' : '地点') + '作为焦点。'));

  }));

    }, 60); } }));
  }

  /* --- 轴与章节 --- */

  const ba = body(sA);
  if (!P.axes.length) ba.appendChild(el('div', { class: 'empty-note' }, '还没有轴。轴是一条独立的时间逻辑。'));
  for (const ax of P.axes) {
    ba.appendChild(rowItem(ax.name, {
      color: ax.color, sel: isSel('axis', ax.id), sub: ax.chapters.length + '章',
      eyeFn: () => { pushUndo(); ax.visible = !ax.visible; markDirty(); renderAll(); },

    }));
    if (ax.visible === false) ba.lastChild.classList.add('dim');

      }));

          onClick: () => { select('chapter', sub.id); scrollChapterIntoView(sub); }

        ba.appendChild(r);

  host.appendChild(sA);

  /* --- 角色 --- */
  const sC = makeSection('chars', '角色', P.characters.length, () => addCharacter(), '新增角色');
  const bc = body(sC);
  if (!P.characters.length) bc.appendChild(el('div', { class: 'empty-note' }, '还没有角色。角色会在画布与角色视图中被引用。'));
  for (const c of P.characters) {
    const n = P.events.filter(e => e.characterIds.includes(c.id)).length;
    const r = rowItem(c.name, {
      color: c.color || '#f06060', sel: isSel('character', c.id), sub: n + '事件',
      kill: () => { S.selection = { type: 'character', id: c.id }; deleteSelection(); },
      onClick: () => {

  /* --- 地点 --- */

    const r = rowItem(c.name, {
      color: c.color || '#b07cff', sel: isSel('place', c.id), sub: n + '事件',
      kill: () => { S.selection = { type: 'place', id: c.id }; deleteSelection(); },
      onClick: () => {
        if (S.viewMode === 'place') { S.focusId = c.id; select('place', c.id); fitView(); }
        else select('place', c.id);
      }
    });
    if (c.parentId) r.classList.add('indent-1');
    bp.appendChild(r);
  }
  host.appendChild(sP);

  /* --- 事件 --- */
  const sE = makeSection('events', '事件', P.events.length, () => {
    const box = $('#canvasWrap').getBoundingClientRect();
    const w = screenToWorld(box.left + box.width / 2, box.top + box.height / 2);
    createEventAt(w.x, w.y);
  }, '新增事件');
  const be = body(sE);
  be.appendChild(el('div', { class: 'search-row' },
    '<input class="inp" id="evSearch" placeholder="搜索标题 / 设定 / 步骤…" value="' + esc(S.search) + '" spellcheck="false">' +
    '<select class="sel" id="evKind" style="width:76px;flex:0 0 76px">' +
      '<option value="all"' + (S.kindFilter === 'all' ? ' selected' : '') + '>全部</option>' +
      '<option value="main"' + (S.kindFilter === 'main' ? ' selected' : '') + '>主线</option>' +
      '<option value="side"' + (S.kindFilter === 'side' ? ' selected' : '') + '>支线</option>' +
    '</select>' +
    '<select class="sel" id="evTrig" style="width:76px;flex:0 0 76px">' +
      '<option value="all"' + (S.trigFilter === 'all' ? ' selected' : '') + '>触发</option>' +
      '<option value="passive"' + (S.trigFilter === 'passive' ? ' selected' : '') + '>被动</option>' +
      '<option value="active"' + (S.trigFilter === 'active' ? ' selected' : '') + '>主动</option>' +
    '</select>'));
  const listBox = el('div', { id: 'evList' });
  be.appendChild(listBox);
  // 注意：此时 sE 还没插进文档，必须用局部查询，否则拿不到这些元素
  fillEventList(listBox, be.querySelector('#evSearch'), be);
  host.appendChild(sE);

  /* --- 悬空伏笔 --- */
  const hooks = P.links.filter(l => l.type === 'foreshadow' && l.state !== 'closed');
  const sH = makeSection('hooks', '悬空伏笔', hooks.length, null);
  const bh = body(sH);
  if (!hooks.length) bh.appendChild(el('div', { class: 'empty-note' }, '没有未回收的伏笔。'));
  for (const lk of hooks) {
    const a = eventById(lk.from), z = eventById(lk.to);
    const r = rowItem((a ? a.title : '?') + ' → ' + (z ? z.title : '?'), {
      color: 'var(--warn)',
      sel: isSel('link', lk.id),
      sub: lk.label || '未回收',
      onClick: () => { select('link', lk.id); if (a) centerOn(a); }
    });
    bh.appendChild(r);
  }
  host.appendChild(sH);

  /* --- 数据概览 --- */
  const sS = makeSection('stats', '概览', null, null);
  const bs = body(sS);
  const orphan = P.events.filter(e => !P.edges.some(g => g.from === e.id || g.to === e.id)).length;
  const openChoice = P.events.reduce((n, e) => n + e.choices.filter(c => !P.edges.some(g => g.viaChoiceId === c.id)).length, 0);
  const noScene = P.events.filter(e => !e.scene.steps.length).length;
  bs.appendChild(el('div', { class: 'meta-list' },
    statsRow('事件 / 依赖 / 引用', P.events.length + ' / ' + P.edges.length + ' / ' + P.links.length) +
    statsRow('孤立事件', orphan + ' 个') +
    statsRow('未闭合的选择支', openChoice + ' 个') +
    statsRow('悬空伏笔', hooks.length + ' 个') +
    statsRow('带门槛的依赖', P.edges.filter(g => g.requirements.length).length + ' 条') +
    statsRow('无剧情细节的事件', noScene + ' 个')));
  host.appendChild(sS);
  if (collapsed.stats === undefined) collapsed.stats = true;

  if (keepId) {
    const n = $('#' + keepId);
    if (n && n.focus) { n.focus(); try { n.setSelectionRange(caret, caret); } catch (e) {} }
  }
}

/** 事件列表的过滤结果。搜索与筛选同时作用于左栏列表和画布上的节点明暗 */
function matchesFilter(ev) {
  const q = (S.search || '').trim().toLowerCase();
  if (q) {
    const hay = (ev.title + ' ' + ev.summary + ' ' + ev.brief + ' ' +
      (ev.tags || []).join(' ') + ' ' +
      ev.scene.steps.map(s => JSON.stringify(s.fields)).join(' ')).toLowerCase();
    if (hay.indexOf(q) < 0) return false;
  }
  if (S.kindFilter !== 'all' && ev.kind !== S.kindFilter) return false;
  if (S.trigFilter !== 'all' && ev.trigger !== S.trigFilter) return false;
  return true;
}
function fillEventList(box, searchInput, scope) {
  scope = scope || box.parentNode || document;
  if (searchInput && !searchInput.dataset.wired) {
    searchInput.dataset.wired = '1';
    searchInput.addEventListener('input', () => { S.search = searchInput.value; refreshEventList(); });
    const k = scope.querySelector('#evKind'), t = scope.querySelector('#evTrig');
    if (k) k.addEventListener('change', () => { S.kindFilter = k.value; refreshEventList(); });
    if (t) t.addEventListener('change', () => { S.trigFilter = t.value; refreshEventList(); });
  }
  box.innerHTML = '';
  if (!P.events.length) {
    box.appendChild(el('div', { class: 'empty-note' }, '还没有事件。双击画布空白处即可创建。'));
    return;
  }
  const list = P.events.filter(matchesFilter).sort((a, b) => a.t - b.t);
  if (!list.length) {
    box.appendChild(el('div', { class: 'empty-note' }, '没有匹配的事件。'));
    return;
  }
  for (const ev of list) {
    const hook = P.links.some(l => l.type === 'foreshadow' && l.state !== 'closed' && l.from === ev.id);
    const r = rowItem(ev.title, {
      color: ev.kind === 'main' ? 'var(--main)' : 'var(--side)',
      sel: isSel('event', ev.id) || S.multi.has(ev.id),
      sub: (hook ? '伏笔 · ' : '') + (ev.trigger === 'active' ? '主动' : '被动'),
      onClick: () => { select('event', ev.id); centerOn(ev); }
    });
    box.appendChild(r);
  }
}
/** 只刷新列表与画布明暗，不重建整栏，避免搜索框失焦 */
function refreshEventList() {
  const box = $('#evList');
  if (!box) { renderLeft(); return; }
  fillEventList(box, null, box.parentNode);
  renderCanvas();
}
function statsRow(k, v) { return '<div class="meta-row"><b>' + esc(k) + '</b><span>' + esc(v) + '</span></div>'; }
function firstLine(s) { const t = String(s).split('\n')[0]; return t.length > 26 ? t.slice(0, 26) + '…' : (t || '（空）'); }
function scrollChapterIntoView(ch) {
  const w = (ch.start + ch.end) / 2;
  const box = $('#canvasWrap').getBoundingClientRect();
  S.camera.x = box.width / 2 - w * S.camera.zoom;
  applyTransform(); markDirty();
}
function centerOn(ev) {
  const box = $('#canvasWrap').getBoundingClientRect();
  S.camera.x = box.width / 2 - (ev.t + NODE_W / 2) * S.camera.zoom;
  S.camera.y = box.height / 2 - (ev.y + 50) * S.camera.zoom;
  applyTransform(); markDirty();
  renderCanvas();
}

/* ============================================================================
   14 · 右栏检查器
   ========================================================================== */
function field(label, inner, hint) {
  return '<div class="field"><label>' + esc(label) + '</label>' + inner +
         (hint ? '<div style="font-size:10.5px;color:var(--text-faint);margin-top:4px">' + hint + '</div>' : '') + '</div>';
}
function inp(prop, value, ph, type) {
  return '<input class="inp" data-set="' + prop + '" type="' + (type || 'text') + '" value="' + esc(value) +
         '" placeholder="' + esc(ph || '') + '" spellcheck="false">';
}
function ta(prop, value, ph, rows) {
  return '<textarea class="ta" data-set="' + prop + '" rows="' + (rows || 4) + '" placeholder="' + esc(ph || '') + '">' +
         esc(value) + '</textarea>';
}
function selBox(prop, value, options) {
  let h = '<select class="sel" data-set="' + prop + '">';
  for (const k in options) h += '<option value="' + k + '"' + (k === value ? ' selected' : '') + '>' + esc(options[k]) + '</option>';
  return h + '</select>';
}
function chipList(kind, values, allFn, nameFn, placeholder) {
  let h = '<div class="chip-list">';
  for (const v of values) {
    h += '<span class="chip-tag"><b>' + esc(nameFn(v) || '已删除') + '</b>' +
         '<button data-chipdel="' + kind + ':' + v + '" title="移除">×</button></span>';
  }
  h += '</div>';
  const all = allFn().filter(x => !values.includes(x.id));
  h += '<div class="picker" style="margin-top:6px"><select class="sel" data-chipadd="' + kind + '">' +
       '<option value="">' + esc(placeholder) + '</option>' +
       all.map(x => '<option value="' + x.id + '">' + esc(x.name) + '</option>').join('') +
       '</select></div>';

}

function renderInspector() {
  const host = $('#inspector');
  const s = S.selection;
  // 灵感视图自成一套：多选时是合并面板，单选时是灵感编辑器
  if (S.viewMode === 'ideas') {
    if (S.multi.size > 1) return inspIdeaBatch(host);
    if (!s || s.type !== 'idea') return inspIdeaEmpty(host);
    return inspIdea(host, ideaById(s.id) || missing(host));
  }
  if (S.multi.size > 1) return inspBatch(host);
  if (!s) {
    host.innerHTML = '<div class="insp-empty">' +
      '未选中任何对象。<br><br>' +
      '单击事件查看属性，双击事件编辑剧情细节。<br>' +
      'Shift+点击 加选，Shift+拖拽空白 框选。<br><br>' +
      '<span class="kbd">双击空白</span> 新建事件 &nbsp; <span class="kbd">方向键</span> 微调位置 &nbsp; <span class="kbd">F</span> 适应视图</div>';
    return;
  }
  if (s.type === 'event') return inspEvent(host, eventById(s.id) || missing(host));
  if (s.type === 'axis') return inspAxis(host, axisById(s.id) || missing(host));
  if (s.type === 'chapter') return inspChapter(host, findChapter(s.id) || missing(host));
  if (s.type === 'character') return inspCharacter(host, charById(s.id) || missing(host));
  if (s.type === 'place') return inspPlace(host, placeById(s.id) || missing(host));
  if (s.type === 'edge') return inspEdge(host, P.edges.find(g => g.id === s.id) || missing(host));
  if (s.type === 'link') return inspLink(host, P.links.find(g => g.id === s.id) || missing(host));
  if (s.type === 'world') return inspWorld(host);
  host.innerHTML = '<div class="insp-empty">未知对象</div>';
}
function missing(host) { host.innerHTML = '<div class="insp-empty">对象已被删除</div>'; return null; }
/** 返回 {ch, axis, path}。绝不把轴引用挂到章节对象上，否则 JSON 序列化会遇到循环引用 */
function findChapter(id) {
  for (const ax of P.axes) {
    const p = pathOfChapter(ax, id);
    if (p) return { ch: p[p.length - 1], axis: ax, path: p };
  }
  return null;
}

function head(host, title, sub) {
  host.innerHTML = '<div class="insp"><div class="insp-title">' + esc(title) + '</div>' +
                   '<div class="insp-sub">' + esc(sub) + '</div><div id="inspBody"></div></div>';
  return $('#inspBody', host);
}
function wireInspector(scope) {
  const host = $('#inspector');
  $$('[data-set]', host).forEach(node => {
    const prop = node.dataset.set;
    const handler = () => {
      let v = node.type === 'checkbox' ? node.checked : node.value;
      if (node.type === 'number') v = v === '' ? 0 : Number(v);
      applySet(scope, prop, v);
    };
    if (node.tagName === 'SELECT') node.addEventListener('change', handler);
    else node.addEventListener('input', handler);
  });
  $$('[data-act]', host).forEach(node => {
    node.addEventListener('click', () => doAct(node.dataset.act, scope, node));
  });
  $$('[data-chipdel]', host).forEach(node => {
    node.addEventListener('click', () => {
      const [kind, id] = node.dataset.chipdel.split(':');
      const ev = scope;
      if (kind === 'char') ev.characterIds = ev.characterIds.filter(x => x !== id);
      if (kind === 'place') ev.placeIds = ev.placeIds.filter(x => x !== id);
      commit();
    });
  });
  $$('[data-chipadd]', host).forEach(node => {
    node.addEventListener('change', () => {
      const kind = node.dataset.chipadd;
      if (!node.value) return;
      if (kind === 'char' && !scope.characterIds.includes(node.value)) scope.characterIds.push(node.value);
      if (kind === 'place' && !scope.placeIds.includes(node.value)) scope.placeIds.push(node.value);
      commit();
    });
  });
}
function commit() {
  markDirty(); renderLeft();
  if (S.viewMode === 'ideas') renderIdeasBoard(); else renderCanvas();
  renderInspector();
}

/* 当前检查器作用域。用独立变量而不是往数据对象上挂标记，避免污染导出的 JSON */
let INSP = { kind: '', obj: null };

function applySet(obj, prop, v) {
  if (!obj) return;
  if (prop === 'tags') obj.tags = String(v).split(/[,，\s]+/).filter(Boolean);
  else if (prop === 'aliases') obj.aliases = String(v).split(/[,，\s]+/).filter(Boolean);
  else if (prop === 'visible') obj.visible = (v === true || v === 'true');
  else obj[prop] = v;

  const kind = INSP.kind;
  if (kind === 'event') {
    const n = document.querySelector('#nodeLayer .node[data-id="' + obj.id + '"]');
    if (prop === 't' || prop === 'y') {
      if (n) { n.style.left = obj.t + 'px'; n.style.top = obj.y + 'px'; }
      redrawEdgesOnly();
    } else {
      renderCanvas();
    }
  } else if (kind === 'idea') {
    obj.updatedAt = nowLabel();
    renderIdeasBoard();
  } else if (kind === 'axis' || kind === 'chapter' || kind === 'character' || kind === 'place') {
    renderCanvas();
  }
  markDirty();
  renderLeft();
}

/* ---- 批量操作 ---- */
function inspBatch(host) {
  INSP = { kind: 'batch', obj: null };
  const evs = Array.from(S.multi).map(eventById).filter(Boolean);
  const b = head(host, '已选中 ' + evs.length + ' 个事件', '批量操作');
  const addSel = (kind, list, label) =>
    '<select class="sel" data-batch-add="' + kind + '"><option value="">' + esc(label) + '</option>' +

    '<div class="batch-bar">' +
      '<button class="btn sm" data-batch="kind:main">设为主线</button>' +
      '<button class="btn sm" data-batch="kind:side">设为支线</button>' +
      '<button class="btn sm" data-batch="trigger:passive">设为被动</button>' +
      '<button class="btn sm" data-batch="trigger:active">设为主动</button>' +
    '</div>' +
    '<div class="batch-bar">' +
      '<button class="btn sm" data-batch="nudge:0:-40">上移 40</button>' +
      '<button class="btn sm" data-batch="nudge:0:40">下移 40</button>' +
      '<button class="btn sm" data-batch="nudge:-40:0">左移 40</button>' +
      '<button class="btn sm" data-batch="nudge:40:0">右移 40</button>' +
    '</div>' +
    '<div style="height:10px"></div>' +
    field('批量加入角色', addSel('char', P.characters, '选择角色…')) +
    field('批量加入地点', addSel('place', P.places, '选择地点…')) +
    '<div class="batch-bar">' +
      '<button class="btn sm" data-batch="clear">取消选择</button>' +
      '<button class="btn sm danger" data-batch="del">删除这 ' + evs.length + ' 个事件</button>' +
    '</div>' +
    '<div class="field" style="margin-top:14px"><label>选中项</label><div class="dep-list">' +
      evs.slice(0, 30).map(e => '<div class="dep-item" data-goto="' + e.id + '">' +
        '<span class="t">' + esc(e.title) + '</span><span class="dir">t=' + Math.round(e.t) + '</span></div>').join('') +
      (evs.length > 30 ? '<div class="empty-note">…还有 ' + (evs.length - 30) + ' 个</div>' : '') +
    '</div></div>';
  $$('[data-batch]', host).forEach(n => n.addEventListener('click', () => batchAct(n.dataset.batch)));
  $$('[data-batch-add]', host).forEach(n => n.addEventListener('change', () => {
    if (!n.value) return;
    pushUndo();
    for (const e of evs) {
      if (n.dataset.batchAdd === 'char' && !e.characterIds.includes(n.value)) e.characterIds.push(n.value);
      if (n.dataset.batchAdd === 'place' && !e.placeIds.includes(n.value)) e.placeIds.push(n.value);
    }
    markDirty(); renderAll();
  }));
  $$('[data-goto]', host).forEach(n => n.addEventListener('click', () => {
    const t = eventById(n.dataset.goto); if (t) { select('event', t.id); centerOn(t); }
  }));
}
function batchAct(cmd) {
  if (cmd === 'clear') { S.multi.clear(); S.selection = null; renderAll(); return; }
  if (cmd === 'del') { deleteSelection(); return; }
  const ids = Array.from(S.multi);
  if (!ids.length) return;
  pushUndo();
  const parts = cmd.split(':');
  for (const id of ids) {
    const ev = eventById(id);
    if (!ev) continue;
    if (parts[0] === 'kind') ev.kind = parts[1];
    else if (parts[0] === 'trigger') ev.trigger = parts[1];
    else if (parts[0] === 'nudge') { ev.t += Number(parts[1]) || 0; ev.y += Number(parts[2]) || 0; }
  }
  markDirty(); renderAll();
  toast('已修改 ' + ids.length + ' 个事件', 'ok', 1600);
}

function setBoundary(ax, chapterId, side, value) {
  let list = null, idx = -1, isSub = false, parent = null;
  for (const c of ax.chapters) {
    if (c.id === chapterId) { list = ax.chapters; idx = ax.chapters.indexOf(c); break; }
    const k = (c.children || []).findIndex(x => x.id === chapterId);
    if (k >= 0) { list = c.children; idx = k; isSub = true; parent = c; break; }
  }
  if (!list || idx < 0) return;
  const cur = list[idx];
  if (side === 'start') {
    if (idx === 0) {
      if (isSub) { cur.start = parent.start; }
      else cur.start = Math.min(value, cur.end - MINW);
    } else {
      const prev = list[idx - 1];
      const v = clamp(value, prev.start + MINW, cur.end - MINW);
      prev.end = v; cur.start = v;
    }
  } else {
    if (idx === list.length - 1) {
      if (isSub) { cur.end = parent.end; }
      else cur.end = Math.max(value, cur.start + MINW);
    } else {
      const nxt = list[idx + 1];
      const v = clamp(value, cur.start + MINW, nxt.end - MINW);
      cur.end = v; nxt.start = v;
    }
  }
  if (isSub) clampChildren(parent);
  for (const c of ax.chapters) clampChildren(c);
}

/* ---- 动作分发 ---- */
function doAct(act, scope, node) {
  if (act === 'del') { deleteSelection(); return; }
  /* ---- 灵感相关动作 ---- */
  if (act === 'idea-to-event') { ideaAdoptAsEvent(scope.id); return; }
  if (act === 'idea-to-step') { ideaAttach(scope.id, 'step'); return; }
  if (act === 'idea-to-brief') { ideaAttach(scope.id, 'brief'); return; }
  if (act === 'idea-del' || act === 'idea-del-selected') { deleteIdeas(); return; }
  if (act === 'idea-unmerge') { ideaUnmerge(scope.id); return; }
  if (act === 'idea-merge') { ideaMerge(Array.from(S.multi)); return; }
  if (act === 'idea-sel-clear') { S.multi.clear(); renderAll(); return; }
  if (act.indexOf('idea-status:') === 0) { ideaSetStatus(scope.id, act.split(':')[1]); return; }
  if (act === 'open-scene') { openSceneEditor(scope.id); return; }
  if (act === 'dup-event') {
    pushUndo();
    const c = clone(scope); c.id = uid('ev'); c.title = scope.title + ' 副本';
    c.t = scope.t + 40; c.y = scope.y + 40; c.choices = c.choices.map(x => ({ id: uid('op'), label: x.label, note: x.note }));
    c.scene.steps = c.scene.steps.map(s => Object.assign({}, s, { id: uid('st') }));
    P.events.push(c); markDirty(); select('event', c.id); return;
  }
  if (act === 'choice-add') {
    pushUndo(); scope.choices.push({ id: uid('op'), label: '选项 ' + (scope.choices.length + 1), note: '' });
    commit(); return;
  }
  if (act.indexOf('choice-del:') === 0) {
    const id = act.split(':')[1];
    pushUndo();
    scope.choices = scope.choices.filter(c => c.id !== id);
    P.edges.forEach(g => { if (g.viaChoiceId === id) g.viaChoiceId = ''; });
    commit(); return;
  }
  if (act.indexOf('choice-branch:') === 0) {
    const id = act.split(':')[1];
    const c = scope.choices.find(x => x.id === id);
    pushUndo();
    const ev = newEvent(scope.t + 260, scope.y + (scope.choices.indexOf(c) - (scope.choices.length - 1) / 2) * 150);
    ev.title = (c && c.label) || '分支事件';
    ev.kind = scope.kind;
    ev.characterIds = scope.characterIds.slice();
    ev.placeIds = scope.placeIds.slice();
    P.events.push(ev);
    P.edges.push({ id: uid('ed'), from: scope.id, to: ev.id, viaChoiceId: id, requirements: [], note: '' });
    markDirty(); select('event', ev.id); toast('已创建分支事件并连好依赖', 'ok'); return;
  }
  if (act.indexOf('dep-del:') === 0) {
    const id = act.split(':')[1];
    pushUndo(); P.edges = P.edges.filter(g => g.id !== id); commit(); return;
  }
  if (act.indexOf('goto:') === 0) {
    const t = eventById(act.split(':')[1]); if (t) { select('event', t.id); centerOn(t); } return;
  }
  if (act === 'chapter-split') {
    const info = findChapter(S.selection.id);
    if (info) splitAt(info.axis.id, info.path.length === 2 ? info.path[0].id : '', (info.ch.start + info.ch.end) / 2);
    return;
  }
  if (act === 'focus-char') { setView('character'); S.focusId = scope.id; select('character', scope.id); fitView(); return; }
  if (act === 'focus-place') { setView('place'); S.focusId = scope.id; select('place', scope.id); fitView(); return; }
  if (act === 'sec-add') {
    pushUndo(); P.world.sections.push({ id: uid('sec'), title: '新小节', text: '' });
    commit(); renderInspector(); return;
  }
  if (act.indexOf('sec-del:') === 0) {
    const id = act.split(':')[1];
    pushUndo(); P.world.sections = P.world.sections.filter(s => s.id !== id); commit(); renderInspector(); return;
  }
}
/* 拖拽中只刷新坐标字段，避免整块重建 */

let sceneCtx = { evId: '', dragFrom: -1 };

function openSceneEditor(evId) {
  const ev = eventById(evId);
  if (!ev) return;
  sceneCtx.evId = evId;
  renderSceneEditor();
}
function renderSceneEditor() {
  const ev = eventById(sceneCtx.evId);
  if (!ev) { closeMask(); return; }
  const steps = ev.scene.steps;
  const typeOpts = STEP_ORDER.map(k => '<option value="' + k + '">' + STEP_TYPES[k].name + '</option>').join('');

  const rows = steps.map((s, i) => {
    const def = STEP_TYPES[s.type];
    const fields = (STEP_FIELDS[s.type] || []).map(([key, label, kind]) => {
      const val = s.fields[key] || '';
      const one = (STEP_FIELDS[s.type] || []).length === 1;
      return '<div><span class="mini-label">' + esc(label) + '</span>' +
        (kind === 'area'
          ? '<textarea class="ta" rows="2" data-step-field="' + key + '" data-step-id="' + s.id + '" style="min-height:44px">' + esc(val) + '</textarea>'
          : '<input class="inp" data-step-field="' + key + '" data-step-id="' + s.id + '" value="' + esc(val) + '">') +
        '</div>';
    }).join('');
    const oneCol = (STEP_FIELDS[s.type] || []).length === 1;
    return '<div class="step" draggable="true" data-idx="' + i + '">' +
      '<div class="s-grip" title="拖动排序">⋮⋮</div>' +
      '<div class="s-body">' +
        '<div class="s-top">' +
          '<span class="s-num">' + (i + 1) + '</span>' +
          '<select class="s-type ' + def.color + '" data-step-type="' + s.id + '">' +
            typeOpts.replace('value="' + s.type + '"', 'value="' + s.type + '" selected') + '</select>' +
          '<div class="tb-spacer" style="flex:1"></div>' +
          '<button class="btn sm" data-step-up="' + i + '" title="上移">↑</button>' +
          '<button class="btn sm" data-step-down="' + i + '" title="下移">↓</button>' +
          '<button class="s-del" data-step-del="' + s.id + '" title="删除这一步">×</button>' +
        '</div>' +
        '<div class="s-fields' + (oneCol ? ' one' : '') + '">' + fields + '</div>' +
      '</div></div>';
  }).join('');

  showModal(
    '<div class="modal wide">' +
      '<div class="m-head">' +
        '<div class="m-title">' + esc(ev.title) + ' · 剧情细节</div>' +
        '<div class="m-sub">' + steps.length + ' 步</div>' +
        '<button class="m-close" data-close="1">×</button>' +
      '</div>' +
      '<div class="m-body">' +
        '<div class="hint-box" style="margin-bottom:14px">这里定义事件的内部经过：对白、旁白、战斗、探索、检定、移动、结算。' +
        '步骤按顺序排列，AI 生成时会读到它们，用来理解这个事件"具体怎么演"。</div>' +
        '<div class="steps" id="stepList">' + (rows || '<div class="empty-note">还没有步骤。用下面的按钮添加第一步。</div>') + '</div>' +
        '<div class="add-step-row">' +
          STEP_ORDER.map(k => '<button data-add-step="' + k + '">+ ' + STEP_TYPES[k].name + '</button>').join('') +
        '</div>' +
      '</div>' +
      '<div class="m-foot">' +
        '<button class="btn primary" data-close="1">完成</button>' +
        '<div class="sp"></div>' +
        '<button class="btn danger" data-act-clear="1">清空全部步骤</button>' +
      '</div>' +
    '</div>');

  const m = $('#mask');
  $$('[data-close]', m).forEach(n => n.addEventListener('click', closeMask));
  $$('[data-add-step]', m).forEach(n => n.addEventListener('click', () => {
    pushUndo();
    ev.scene.steps.push({ id: uid('st'), type: n.dataset.addStep, fields: {}, children: [] });
    markDirty(); renderSceneEditor(); renderCanvas();
  }));
  $$('[data-step-type]', m).forEach(n => n.addEventListener('change', () => {
    const s = ev.scene.steps.find(x => x.id === n.dataset.stepType);
    if (s) { pushUndo(); s.type = n.value; markDirty(); renderSceneEditor(); }
  }));
  $$('[data-step-del]', m).forEach(n => n.addEventListener('click', () => {
    pushUndo();
    ev.scene.steps = ev.scene.steps.filter(x => x.id !== n.dataset.stepDel);
    markDirty(); renderSceneEditor(); renderCanvas();
  }));
  $$('[data-step-up]', m).forEach(n => n.addEventListener('click', () => {
    const i = Number(n.dataset.stepUp);
    if (i <= 0) return;
    pushUndo();
    const a = ev.scene.steps; a.splice(i - 1, 0, a.splice(i, 1)[0]);
    markDirty(); renderSceneEditor();
  }));
  $$('[data-step-down]', m).forEach(n => n.addEventListener('click', () => {
    const i = Number(n.dataset.stepDown);
    if (i >= ev.scene.steps.length - 1) return;
    pushUndo();
    const a = ev.scene.steps; a.splice(i + 1, 0, a.splice(i, 1)[0]);
    markDirty(); renderSceneEditor();
  }));
  $$('[data-step-field]', m).forEach(n => n.addEventListener('input', () => {
    const s = ev.scene.steps.find(x => x.id === n.dataset.stepId);
    if (s) { s.fields[n.dataset.stepField] = n.value; markDirty(); }
  }));
  const clearBtn = $('[data-act-clear]', m);
  if (clearBtn) clearBtn.addEventListener('click', () => {
    if (!confirmBox('确定清空这个事件的全部剧情步骤？')) return;
    pushUndo(); ev.scene.steps = []; markDirty(); renderSceneEditor(); renderCanvas();
  });

  // 拖动排序
  let dragIdx = -1;
  $$('#stepList .step', m).forEach(node => {
    node.addEventListener('dragstart', () => { dragIdx = Number(node.dataset.idx); node.classList.add('dragging'); });
    node.addEventListener('dragend', () => { node.classList.remove('dragging'); });
    node.addEventListener('dragover', e => e.preventDefault());
    node.addEventListener('drop', e => {
      e.preventDefault();
      const to = Number(node.dataset.idx);
      if (dragIdx < 0 || dragIdx === to) return;
      pushUndo();
      const arr = ev.scene.steps;
      arr.splice(to, 0, arr.splice(dragIdx, 1)[0]);
      dragIdx = -1;
      markDirty(); renderSceneEditor();
    });
  });
}

function openHelp() {

        '<div class="ai-sec-title">核心概念</div>' +
        '<div class="hint-box">' +
          '<b>轴</b>：一条独立的时间逻辑（主线轴、某角色成长轴、某事件自己的轴）。轴是铺满画面高度的半透明色带，' +
          '各自拥有分割线与设定文本，可分别开关。不同轴互不约束，因此色带会重叠——这正是"同一批事件被不同分章方式框定"的效果。<br><br>' +
          '<b>章节</b>：由分割线切出的区间。同一条轴上的章节首尾相接、不留空隙。<b>拖动分割线</b>调整边界，<b>双击分割线</b>在两侧之外再切一刀。<br><br>' +
          '<b>事件</b>：画布上的节点，携带逻辑时间 t 与自由的纵向 y。它不属于任何轴，因此同时出现在所有轴上；' +
          '"属于哪一章"由 t 与各轴分割线求交实时算出，不单独存储。<br><br>' +
          '<b>依赖</b>：实线箭头，表示"源事件完成且满足全部门槛后，目标解锁"。<br>' +
          '<b>分支</b>：在右侧为依赖指定触发选项，即成为"只有选了某个选项才成立"的分支。<br>' +
          '<b>额外门槛</b>：依赖上可以再加条件（标记 / 物品 / 属性 / 自定义）。门槛是给人看和给 AI 读的约束说明，不会自动推导，画布上会显示为 ⛓ 标注。<br><br>' +
          '<b>引用线</b>：紫色虚线，非强依赖的叙事关联（做过某事件会让此事件走向不同）。只作跳转与提示，不构成解锁条件。<br>' +

          '存在顶栏第四个入口「<em>灵感</em>」里——中间是卡片墙，随手在顶部输入框写一句、回车即存。<br>' +
          '需要用的时候：选中一条，在右侧把它<em>转为事件</em>或<em>挂到已有事件</em>上；几条零散的想法若其实是一件事，' +

        '<div class="sp"></div>' +
        '<button class="btn" data-close="1">取消</button>' +
        '<button class="btn primary" data-save="1">保存</button>' +
      '</div>' +
    '</div>');
  const m = $('#mask');
  $$('[data-close]', m).forEach(n => n.addEventListener('click', closeMask));
  $('#cfgMode', m).addEventListener('change', () => {
    const mode = $('#cfgMode').value;
    const agent = mode === 'agent';
    $('#directBox').style.display = agent ? 'none' : '';
    $('#agentBox').style.display = agent ? '' : 'none';
    const tb = $('[data-test]', m); if (tb) tb.style.display = agent ? 'none' : '';
    setSessionMode(mode);
  });
  $('[data-save]', m).addEventListener('click', async () => {
    const baseURL = $('#cfgBase').value.trim();
    const model = $('#cfgModel').value.trim();
    const apiKey = $('#cfgKey').value.trim();
    S.ai.autoMode = $('#cfgAuto').value;
    AICFG.baseURL = baseURL; AICFG.model = model;
    if (IO.mode === 'server') {
      const body = { baseURL, model };
      if (apiKey) body.apiKey = apiKey;
      const r = await fetch('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const j = await r.json();
      AICFG.hasKey = !!j.hasKey;
    } else if (apiKey) { AICFG.apiKey = apiKey; AICFG.hasKey = true; }
    try { localStorage.setItem('plotstudio.ai', JSON.stringify({ baseURL, model, autoMode: S.ai.autoMode })); } catch (e) {}
    renderAiStatus(); closeMask();
    toast(S.session.mode === 'agent' ? '已接入 Agent 会话' : '设置已保存', 'ok');
  });
  $('[data-test]', m).addEventListener('click', async e => {
    e.target.textContent = '测试中…';
    try {
      const r = await aiCall({ model: $('#cfgModel').value.trim() || 'gpt-4o-mini',
        messages: [{ role: 'user', content: '回复两个字：可用' }] });
      toast('连接正常：' + (r.choices && r.choices[0] ? String(r.choices[0].message.content).slice(0, 40) : '已响应'), 'ok');
    } catch (err) { toast('连接失败：' + err.message, 'err'); }
    e.target.textContent = '测试连接';
  });
}

    '- 新增事件要给出合理的 t 与 y，避免与既有节点重叠位置。',
    '- 用户让你"把灵感用起来"时：先 list_ideas 通读灵感库，再对照 list_timeline / list_graph 找位置，逐条给出具体建议而不是泛泛而谈。',
    '  如果发现多条灵感其实讲的是同一件事，明确指出可以合并的组合（用 idea.merge，或建议用户在灵感视图里多选后手动合并）。',
    '- 扩写某条灵感前，先 get_idea 读它：若它由多条灵感合并而来，或库里还有同标签的其他灵感，把能融合的一并融进去，并在回复里说明你融合了哪几条、各自的取舍。',
    '- 修改完成后，用一段简短的中文说明你改了什么、为什么，以及留下了哪些伏笔。',
    '- 不要输出 JSON 代码块作为最终回答，改动一律通过 propose_patch 提交。'
  ].join('\n');
}

/** 按当前选中对象检索灵感库：选中事件时优先匹配它引用的角色 / 地点与标题关键词。
    搁置与已合并的条目不再主动打扰，所以不进候选。 */
function relatedIdeas(limit) {
  const s = S.selection;
  const ev = s && s.type === 'event' ? eventById(s.id) : null;
  const chars = new Set(ev ? ev.characterIds : []);
  const places = new Set(ev ? ev.placeIds : []);
  const words = ev
    ? (ev.title + ' ' + (ev.summary || '') + ' ' + (ev.tags || []).join(' '))
        .split(/[\s,，、。·:：/]+/).filter(w => w.length >= 2)
    : [];
  const scored = [];
  for (const i of P.ideas) {
    if (i.status === 'merged' || i.status === 'parked') continue;
    let sc = 0;
    for (const c of (i.characterIds || [])) if (chars.has(c)) sc += 3;
    for (const p of (i.placeIds || [])) if (places.has(p)) sc += 3;
    if (words.length) {
      const hay = i.title + ' ' + i.text + ' ' + (i.tags || []).join(' ');
      for (const w of words) if (hay.indexOf(w) >= 0) sc += 1;
    }
    // 已经用过的不再重复推荐
    if (sc > 0 && !(i.usedBy || []).length) scored.push({ i: i, sc: sc });
  }
  scored.sort((a, b) => b.sc - a.sc);
  return scored.slice(0, limit || 6).map(x => x.i);
}

function buildContextPreview() {
  const s = S.selection;
  const lines = [];
  lines.push('【世界观】' + (P.world.brief ? P.world.brief.slice(0, 120).replace(/\n/g, ' ') : '（空）'));
  const axs = P.axes.filter(a => a.visible);
  for (const a of axs) {
    const { chapter, sub } = s && s.type === 'event' ? chapterAt(a, (eventById(s.id) || { t: 0 }).t) : { chapter: null, sub: null };
    lines.push('【轴】' + a.name + (a.brief ? ' — ' + a.brief.slice(0, 60).replace(/\n/g, ' ') : '') +
      (chapter ? '  ▸ 当前落在：' + chapter.title + (sub ? ' / ' + sub.title : '') : ''));
  }
  if (s && s.type === 'event') {
    const ev = eventById(s.id);
    if (ev) {
      lines.push('【选中事件】' + ev.title + ' — ' + (ev.summary || '（无摘要）'));
      for (const cid of ev.characterIds) { const c = charById(cid); if (c) lines.push('【角色】' + c.name + ' — ' + (c.brief || '').slice(0, 80).replace(/\n/g, ' ')); }
      for (const pid of ev.placeIds) { const pl = placeById(pid); if (pl) lines.push('【地点】' + pl.name + ' — ' + (pl.brief || '').slice(0, 80).replace(/\n/g, ' ')); }
    }
  }
  if (s && s.type === 'idea') {
    const it = ideaById(s.id);
    if (it) {
      lines.push('【选中灵感】' + ideaTitle(it) + '（' + IDEA_KINDS[it.kind].name + ' · ' + IDEA_STATUS[it.status].name + '）— ' +
        (it.text || '').slice(0, 160).replace(/\n/g, ' '));
      if ((it.mergedFrom || []).length) {
        lines.push('【该灵感合并自】' + it.mergedFrom.map(x => ideaTitle(ideaById(x)) || x).join('、'));
      }
    }
  }
  // 相关灵感：按当前对象捞出的可复用想法，让 AI 有机会提醒用户"这里可以塞某某"
  const rel = relatedIdeas(6);
  if (rel.length) lines.push('【相关灵感】' + rel.map(i => ideaTitle(i) + '（' + IDEA_KINDS[i.kind].name + '）').join(' / '));
  if (S.ai.scope === 'global') lines.push('【范围】整个工程：' + P.events.length + ' 事件 / ' + P.characters.length + ' 角色 / ' + P.places.length + ' 地点 / ' + P.ideas.length + ' 灵感');
  else if (S.ai.scope === 'chapter') lines.push('【范围】当前章节及其全部事件');
  else lines.push('【范围】当前选中对象的邻域（一跳）');
  return lines.join('\n');
}

async function aiCall(body) {
  const payload = Object.assign({ model: AICFG.model || 'gpt-4o-mini', stream: false }, body);
  if (IO.mode === 'server') {
    const r = await fetch('/api/ai', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ payload }) });
    const text = await r.text();
    let j; try { j = JSON.parse(text); } catch (e) { throw new Error(text.slice(0, 200)); }
    if (!r.ok) throw new Error(j.error + (j.detail ? '：' + j.detail.slice(0, 200) : ''));
    return j;
  }
  if (!AICFG.baseURL) throw new Error('尚未配置接口地址');
  const r = await fetch(AICFG.baseURL.replace(/\/+$/, '') + '/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + AICFG.apiKey },
    body: JSON.stringify(payload)
  });
  const text = await r.text();
  let j; try { j = JSON.parse(text); } catch (e) { throw new Error(text.slice(0, 200)); }
  if (!r.ok) throw new Error((j.error && j.error.message) || ('HTTP ' + r.status));
  return j;
}

const TOOL_IMPL = {
  read_world: () => ({ brief: P.world.brief, sections: P.world.sections }),
  list_entities: a => {
    if (a.kind === 'character') return P.characters.map(c => ({ id: c.id, name: c.name, aliases: c.aliases, tags: c.tags, brief: c.brief }));
    if (a.kind === 'place') return P.places.map(c => ({ id: c.id, name: c.name, parentId: c.parentId, tags: c.tags, brief: c.brief }));
    return P.axes.map(x => ({ id: x.id, name: x.name, brief: x.brief, visible: x.visible, chapters: x.chapters.map(k => ({ id: k.id, title: k.title, brief: k.brief, start: k.start, end: k.end })) }));
  },
  get_entity: a => {
    const c = charById(a.id); if (c) return c;
    const p = placeById(a.id); if (p) return p;
    const x = axisById(a.id); if (x) return { id: x.id, name: x.name, brief: x.brief, chapters: x.chapters };
    const k = findChapter(a.id); if (k) return { id: k.ch.id, title: k.ch.title, brief: k.ch.brief, start: k.ch.start, end: k.ch.end, axis: k.axis.name };
    return { error: '未找到 ' + a.id };
  },
  search_events: a => {
    const q = String(a.query || '').toLowerCase();
    return P.events.filter(e =>
      (e.title + ' ' + e.summary + ' ' + e.brief + ' ' + e.scene.steps.map(s => JSON.stringify(s.fields)).join(' '))
        .toLowerCase().indexOf(q) >= 0
    ).map(e => ({ id: e.id, title: e.title, t: e.t, kind: e.kind, summary: e.summary })).slice(0, 30);
  },
  get_event: a => {
    const e = eventById(a.id);
    if (!e) return { error: '未找到 ' + a.id };
    const chapters = P.axes.map(x => { const c = chapterAt(x, e.t); return { axis: x.name, chapter: c.chapter && c.chapter.title, sub: c.sub && c.sub.title }; });
    return {
      id: e.id, title: e.title, kind: e.kind, trigger: e.trigger, t: e.t, y: e.y,
      summary: e.summary, brief: e.brief,
      places: e.placeIds.map(i => { const p = placeById(i); return p && p.name; }),
      characters: e.characterIds.map(i => { const c = charById(i); return c && c.name; }),
      chaptersDerived: chapters,
      choices: e.choices,
      scene: e.scene.steps,
      edgesOut: P.edges.filter(g => g.from === e.id).map(g => ({ id: g.id, to: g.to, viaChoiceId: g.viaChoiceId })),
      edgesIn: P.edges.filter(g => g.to === e.id).map(g => ({ id: g.id, from: g.from, viaChoiceId: g.viaChoiceId })),
      links: P.links.filter(g => g.from === e.id || g.to === e.id)
    };
  },
  list_timeline: () => ({
    axes: P.axes.map(x => ({ id: x.id, name: x.name, brief: x.brief, chapters: x.chapters.map(k => ({ title: k.title, brief: k.brief, start: k.start, end: k.end, children: (k.children || []).map(s => ({ title: s.title, start: s.start, end: s.end })) })) })),
    events: P.events.slice().sort((a, b) => a.t - b.t).map(e => ({
      id: e.id, title: e.title, t: e.t, y: e.y, kind: e.kind, trigger: e.trigger, summary: e.summary,
      chapterOfMainAxis: (() => { const c = chapterAt(P.axes[0], e.t); return c.chapter && c.chapter.title; })()
    }))
  }),
  list_graph: () => ({
    edges: P.edges.map(g => ({
      id: g.id, from: eventById(g.from) && eventById(g.from).title,
      to: eventById(g.to) && eventById(g.to).title, via: g.viaChoiceId,
      requirements: g.requirements.map(r => (REQ_TYPES[r.type] || {}).name + ':' + r.key)
    })),
    links: P.links.map(g => ({
      id: g.id, from: eventById(g.from) && eventById(g.from).title,
      to: eventById(g.to) && eventById(g.to).title, type: g.type, note: g.note,
      state: g.type === 'foreshadow' ? (g.state || 'open') : ''
    })),
    openForeshadows: P.links.filter(l => l.type === 'foreshadow' && l.state !== 'closed').map(l => ({
      id: l.id,
      plantedAt: eventById(l.from) && eventById(l.from).title,
      plannedPayoffAt: eventById(l.to) && eventById(l.to).title,
      label: l.label, note: l.note
    }))
  }),
  list_ideas: a => {
    const args = a || {};
    const q = String(args.query || '').toLowerCase();
    return P.ideas.filter(i =>
      (!args.status || i.status === args.status) &&
      (!args.kind || i.kind === args.kind) &&
      (!q || (i.text + ' ' + i.title + ' ' + (i.tags || []).join(' ') + ' ' + i.expansion).toLowerCase().indexOf(q) >= 0)
    ).map(i => ({
      id: i.id, title: ideaTitle(i), kind: i.kind, status: i.status, tags: i.tags,
      text: (i.text || '').slice(0, 300),
      hasExpansion: !!i.expansion, variantCount: (i.variants || []).length,
      mergedFrom: i.mergedFrom, mergedInto: i.mergedInto,
      characters: (i.characterIds || []).map(x => (charById(x) || {}).name).filter(Boolean),
      places: (i.placeIds || []).map(x => (placeById(x) || {}).name).filter(Boolean),
      usedBy: i.usedBy
    })).slice(0, 80);
  },
  get_idea: a => {
    const i = ideaById(a.id);
    if (!i) return { error: '未找到 ' + a.id };
    return Object.assign({}, i, {
      displayTitle: ideaTitle(i),
      mergedFromTitles: (i.mergedFrom || []).map(x => ideaTitle(ideaById(x)) || x),
      mergedIntoTitles: i.mergedInto ? [ideaTitle(ideaById(i.mergedInto)) || i.mergedInto] : []
    });
  },
  propose_patch: a => {
    const prop = { id: uid('pp'), summary: a.summary || '（无说明）', ops: a.ops || [] };
    prop.textOnly = prop.ops.every(isTextOp);
    S.ai.pending = S.ai.pending || [];
    S.ai.pending.push(prop);
    setTimeout(() => { renderChat(); if (prop.textOnly && S.ai.autoMode === 'text') applyProposal(prop.id); }, 0);
    return { ok: true, note: prop.textOnly ? '文本类改动，已按设置处理' : '结构类改动，等待用户确认', ops: prop.ops.length };
  }
};

/** 把外部（AI / agent）给的 requirements 规范化成内部结构 */
function normReqs(list) {
  return (list || []).map(r => ({
    id: r.id || uid('rq'),
    type: REQ_TYPES[r.type] ? r.type : 'custom',
    key: r.key || '', value: r.value || '', note: r.note || ''
  }));
}

/** 只有不改动图拓扑、且不新增删除实体的操作才算文本类（ADR-0005） */
function isTextOp(op) {
  const textOnly = { 'event.update': 1, 'character.update': 1, 'place.update': 1, 'axis.update': 1, 'chapter.update': 1, 'world.update': 1, 'idea.update': 1 };
  if (!textOnly[op.op]) return false;
  const p = op.patch || {};
  const structural = ['t', 'y', 'kind', 'trigger', 'placeIds', 'characterIds', 'choices', 'start', 'end', 'chapters', 'color', 'parentId', 'visible'];
  // 灵感另有一组结构字段：原文、标题、状态、标签与合并关系都不算"纯文本"。
  // 于是 idea.update 只有写 expansion / variants 时才自动落盘，其余改动都要用户确认。
  if (op.op === 'idea.update') structural.push('text', 'title', 'status', 'tags', 'mergedFrom', 'mergedInto');
  return !structural.some(k => k in p);
}

function diffLines(prop) {
  // 同一批改动里新建的实体，连线说明要能直接显示它们的名字而不是裸 id
  const fresh = {};
  for (const op of prop.ops) {
    if (!op.data) continue;
    if (op.op === 'event.create') fresh[op.data.id] = op.data.title;
    if (op.op === 'character.create') fresh[op.data.id] = op.data.name;
    if (op.op === 'place.create') fresh[op.data.id] = op.data.name;
  }
  const label = id => {
    const e = eventById(id); if (e) return e.title;
    const c = charById(id); if (c) return c.name;
    const p = placeById(id); if (p) return p.name;
    return fresh[id] || id;
  };
  const out = [];
  for (const op of prop.ops) {
    if (op.op === 'event.create') {
      out.push({ cls: 'diff-add', t: '+ 新增事件「' + (op.data.title || op.data.id || '') + '」(t=' + (op.data.t || 0) + ')' });
    } else if (op.op === 'event.delete') {
      const e = eventById(op.id);
      out.push({ cls: 'diff-del', t: '- 删除事件「' + (e ? e.title : op.id) + '」及其全部连线' });
    } else if (op.op === 'event.update') {
      const e = eventById(op.id);
      for (const k in (op.patch || {})) {
        const before = e ? JSON.stringify(e[k]) : '—';
        out.push({ cls: 'diff-ctx', t: '  ' + (e ? e.title : op.id) + ' · ' + k + ': ' + String(before).slice(0, 60) });
        out.push({ cls: 'diff-add', t: '+ ' + JSON.stringify(op.patch[k]).slice(0, 160) });
      }
    } else if (op.op === 'edge.create') {
      const reqs = (op.requirements || []).map(r => (REQ_TYPES[r.type] ? REQ_TYPES[r.type].name : '条件') + ':' + (r.key || '—'));
      out.push({ cls: 'diff-add', t: '+ 依赖：' + label(op.from) + ' → ' + label(op.to) +
        (op.viaChoiceId ? '（经某选项）' : '') + (reqs.length ? ' + 门槛 ' + reqs.join('，') : '') });
    } else if (op.op === 'edge.update') {
      const g0 = P.edges.find(x => x.id === op.id);
      for (const k in (op.patch || {})) {
        out.push({ cls: 'diff-add', t: '+ 依赖更新' + (g0 ? '（' + label(g0.from) + ' → ' + label(g0.to) + '）' : '') + ' · ' + k + ' = ' + JSON.stringify(op.patch[k]).slice(0, 140) });
      }
    } else if (op.op === 'edge.delete') {
      const g = P.edges.find(x => x.id === op.id);
      out.push({ cls: 'diff-del', t: '- 删除依赖：' + label(g ? g.from : '?') + ' → ' + label(g ? g.to : '?') });
    } else if (op.op === 'link.create') {
      out.push({ cls: 'diff-add', t: '+ 引用线：' + label(op.from) + ' ⇢ ' + label(op.to) +
        '（' + (LINK_TYPES[op.type] ? LINK_TYPES[op.type].name : op.type || '影响') +
        (op.type === 'foreshadow' && op.state !== 'closed' ? ' · 未回收' : '') + '）' });
    } else if (op.op === 'link.update') {
      const l0 = P.links.find(x => x.id === op.id);
      for (const k in (op.patch || {})) {
        out.push({ cls: 'diff-add', t: '+ 引用线更新' + (l0 ? '（' + label(l0.from) + ' ⇢ ' + label(l0.to) + '）' : '') + ' · ' + k + ' = ' + JSON.stringify(op.patch[k]).slice(0, 140) });
      }
    } else if (op.op === 'link.delete') {
      out.push({ cls: 'diff-del', t: '- 删除引用线 ' + op.id });
    } else if (op.op === 'character.create' || op.op === 'place.create') {
      out.push({ cls: 'diff-add', t: '+ 新增' + (op.op.indexOf('character') === 0 ? '角色' : '地点') + '「' + ((op.data && op.data.name) || '') + '」' });
    } else if (op.op === 'character.update' || op.op === 'place.update' || op.op === 'axis.update' || op.op === 'chapter.update' || op.op === 'world.update') {
      for (const k in (op.patch || {})) out.push({ cls: 'diff-add', t: '+ ' + op.op + ' · ' + k + ' = ' + JSON.stringify(op.patch[k]).slice(0, 140) });
    } else if (op.op === 'idea.create') {
      out.push({ cls: 'diff-add', t: '+ 新增灵感「' + ideaTitle(op.data || {}) + '」' });
    } else if (op.op === 'idea.update') {
      const i0 = ideaById(op.id);
      for (const k in (op.patch || {})) {
        out.push({ cls: 'diff-add', t: '+ 灵感「' + (i0 ? ideaTitle(i0) : op.id) + '」· ' + k + ' = ' + JSON.stringify(op.patch[k]).slice(0, 140) });
      }
    } else if (op.op === 'idea.delete') {
      const i0 = ideaById(op.id);
      out.push({ cls: 'diff-del', t: '- 删除灵感「' + (i0 ? ideaTitle(i0) : op.id) + '」' });
    } else if (op.op === 'idea.merge') {
      out.push({ cls: 'diff-add', t: '+ 合并 ' + ((op.ids || []).length) + ' 条灵感为一条（来源保留在库里）' });
    } else if (op.op === 'idea.mark') {
      const i0 = ideaById(op.id);
      out.push({ cls: 'diff-add', t: '+ 灵感「' + (i0 ? ideaTitle(i0) : op.id) + '」标记为 ' + ((IDEA_STATUS[op.status] || {}).name || op.status || '') });
    } else {
      out.push({ cls: 'diff-ctx', t: '  ' + op.op });
    }
  }
  return out;
}

function applyProposal(pid) {
  const list = S.ai.pending || [];
  const i = list.findIndex(x => x.id === pid);
  if (i < 0) return;
  const prop = list[i];
  pushUndo();
  const created = [];
  for (const op of prop.ops) {
    try {
      if (op.op === 'event.create') {
        const ev = newEvent(op.data.t || 0, op.data.y || 0);
        Object.assign(ev, op.data, { id: op.data.id && !eventById(op.data.id) ? op.data.id : uid('ev') });
        ev.scene = { steps: (op.data.scene && op.data.scene.steps) || [] };
        ev.choices = op.data.choices || [];
        ev.placeIds = op.data.placeIds || []; ev.characterIds = op.data.characterIds || [];
        P.events.push(ev); created.push(ev.id);
      } else if (op.op === 'event.update') {
        const e = eventById(op.id); if (e) Object.assign(e, op.patch || {});
      } else if (op.op === 'event.delete') {
        P.events = P.events.filter(x => x.id !== op.id);
        P.edges = P.edges.filter(g => g.from !== op.id && g.to !== op.id);
        P.links = P.links.filter(g => g.from !== op.id && g.to !== op.id);
      } else if (op.op === 'edge.create') {
         if (eventById(op.from) && eventById(op.to) && !P.edges.some(g => g.from === op.from && g.to === op.to)) {
          P.edges.push({ id: uid('ed'), from: op.from, to: op.to, viaChoiceId: op.viaChoiceId || '',
             requirements: normReqs(op.requirements), note: op.note || '' });
         }
       } else if (op.op === 'edge.update') {
         const g = P.edges.find(x => x.id === op.id);
         if (g) {
           Object.assign(g, op.patch || {});
           if ('requirements' in (op.patch || {})) g.requirements = normReqs(op.patch.requirements);
         }
       } else if (op.op === 'edge.delete') {
        P.edges = P.edges.filter(g => g.id !== op.id);
      } else if (op.op === 'link.create') {
         if (eventById(op.from) && eventById(op.to)) {
           P.links.push({ id: uid('lk'), from: op.from, to: op.to, type: op.type || 'influence',
             label: op.label || '', note: op.note || '',
             state: (op.type === 'foreshadow' && op.state === 'closed') ? 'closed' : (op.type === 'foreshadow' ? 'open' : '') });
         }
       } else if (op.op === 'link.update') {
         const g = P.links.find(x => x.id === op.id);
         if (g) Object.assign(g, op.patch || {});
       } else if (op.op === 'link.delete') {
        P.links = P.links.filter(g => g.id !== op.id);
      } else if (op.op === 'character.create') {
        const c = Object.assign({ id: uid('ch'), name: '新角色', aliases: [], color: '#f06060', brief: '', tags: [] }, op.data || {});
        P.characters.push(c); created.push(c.id);
      } else if (op.op === 'character.update') {
        const c = charById(op.id); if (c) Object.assign(c, op.patch || {});
      } else if (op.op === 'place.create') {
        const c = Object.assign({ id: uid('pl'), name: '新地点', parentId: '', color: '#b07cff', brief: '', tags: [] }, op.data || {});
        P.places.push(c); created.push(c.id);
      } else if (op.op === 'place.update') {
        const c = placeById(op.id); if (c) Object.assign(c, op.patch || {});
      } else if (op.op === 'idea.create') {
        const data = Object.assign({}, op.data || {});
        const it = newIdea(data);
        if (data.id && !ideaById(data.id)) it.id = data.id;
        P.ideas.push(it); created.push(it.id);
      } else if (op.op === 'idea.update') {
        const it = ideaById(op.id);
        if (it) { Object.assign(it, op.patch || {}); it.updatedAt = nowLabel(); }
      } else if (op.op === 'idea.delete') {
        P.ideas = P.ideas.filter(x => x.id !== op.id);
        // 清掉指向被删条目的软合并指针与采用记录，避免留下悬空引用
        P.ideas.forEach(x => {
          if (x.mergedInto === op.id) x.mergedInto = '';
          x.mergedFrom = (x.mergedFrom || []).filter(y => y !== op.id);
          x.usedBy = (x.usedBy || []).filter(u => u.id !== op.id);
        });
      } else if (op.op === 'idea.merge') {
        const ids = (op.ids || []).filter(id => { const i = ideaById(id); return i && i.status !== 'merged'; });
        if (ids.length >= 2) mergeIdeasCore(ids, op.data || {});
      } else if (op.op === 'idea.mark') {
        const it = ideaById(op.id);
        if (it) {
          if (IDEA_STATUS[op.status]) it.status = op.status;
          if (op.usedBy) it.usedBy = op.usedBy;
          it.updatedAt = nowLabel();
        }
      } else if (op.op === 'axis.update') {
        const x = axisById(op.id); if (x) Object.assign(x, op.patch || {});
      } else if (op.op === 'chapter.update') {
        const k = findChapter(op.id);
        if (k) {
          Object.assign(k.ch, op.patch || {});
          if (k.path.length === 1) { k.axis.chapters = tileChapters(k.axis.chapters, 0, 1000); }
          else clampChildren(k.path[0]);
        }
      } else if (op.op === 'world.update') {
        Object.assign(P.world, op.patch || {});
      }
    } catch (e) { /* 单个操作失败不影响其余 */ }
  }
  P = normalize(P);
  list.splice(i, 1);
  prop.applied = true;
  prop.created = created;
  S.ai.applied = S.ai.applied || [];
  S.ai.applied.push(prop);
  markDirty();
  renderAll();
  if (created.length) { S.selection = { type: 'event', id: created[0] }; renderInspector(); }
  toast('AI 改动已写入（可撤销）', 'ok');
  renderChat();
}
function undoLastAiApply() {
  if (!S.ai.applied || !S.ai.applied.length) return;
  undo();
  const p = S.ai.applied.pop();
  toast('已撤销 AI 操作：' + p.summary);
}
async function rejectProposal(pid) {
  S.ai.pending = (S.ai.pending || []).filter(x => x.id !== pid);
  S.ai.api.push({ role: 'user', content: '[系统] 用户拒绝了这个提案，请不要重复提交它，改为调整思路后重新提案。' });
  renderChat();
}

async function runAgent(userText) {
  S.ai.busy = true;
  renderAiStatus();
  const shown = { role: 'assistant', content: '', tools: [] };
  S.ai.messages.push({ role: 'user', content: userText });
  renderChat();
  S.ai.api.push({ role: 'user', content: userText });

  try {
    for (let round = 0; round < 8; round++) {
      const body = {
        // 左栏那个「将自动装入」的预览必须真的装进去，否则选中对象与相关灵感都白列了
        messages: [{ role: 'system', content: aiSystemPrompt() + '\n\n当前上下文：\n' + buildContextPreview() }].concat(S.ai.api.slice(-40)),
        tools: AI_TOOLS,
        tool_choice: 'auto',
        temperature: 0.8
      };
      const j = await aiCall(body);
      const msg = j.choices && j.choices[0] && j.choices[0].message;
      if (!msg) throw new Error('返回格式异常');
      S.ai.api.push(msg);

      if (msg.tool_calls && msg.tool_calls.length) {
        const names = msg.tool_calls.map(t => t.function.name);
        S.ai.messages.push({ role: 'tool', content: '调用 ' + names.join('、') });
        renderChat();
        for (const call of msg.tool_calls) {
          let args = {};
          try { args = JSON.parse(call.function.arguments || '{}'); } catch (e) {}
          const impl = TOOL_IMPL[call.function.name];
          let result;
          try { result = impl ? impl(args) : { error: '未实现的工具' }; }
          catch (err) { result = { error: String(err.message || err) }; }
          S.ai.api.push({ role: 'tool', tool_call_id: call.id, content: JSON.stringify(result).slice(0, 12000) });
        }
        continue;
      }
      const content = msg.content || '';
      S.ai.messages.push({ role: 'assistant', content: content });
      renderChat();
      break;
    }
  } catch (e) {
    S.ai.messages.push({ role: 'assistant', content: '出错：' + e.message, err: true });
    renderChat();
  }
  S.ai.busy = false;
  renderAiStatus();
}

function quickPrompt(kind) {

    conflict: '请为' + target + '设计 2 个有张力的冲突方案，要能推动既有任务线，并指出冲突会如何改变相关角色的处境。然后挑一个最合适的落成事件。',
    foreshadow: '请检查整个工程的依赖与引用线，找出可以埋设伏笔的位置，并用引用线（type=foreshadow）把它们连起来。至少给出 2 组埋设与回收。',
    link: '请找出当前工程中断裂或缺失的因果关联，用引用线补上，并说明每条引用线的叙事理由。',
    chapter: '请读一遍当前轴的章节划分与各章节设定，指出哪些章节缺少明确的框定或目标，并给出改写后的章节设定文本。',
    detail: '请为' + target + '补全剧情细节（场景步骤），要求步骤类型多样、信息具体，能直接交给编剧落地。',
    ideas: '请把灵感库里还没用上的想法用起来。先用 list_ideas 读全部灵感（未采用与搁置的都要看），再对照 list_timeline、list_graph 与各章节的设定文本，逐条判断最适合落地的位置：具体该放进哪个事件、哪一章，或朝什么方向扩写。如果发现多条灵感其实讲的是同一件事，明确指出可以合并的组合（用 idea.merge 提交，或建议我在灵感视图里多选后手动合并）。确实暂时用不上的，直接说明理由，不要硬塞。最后挑 2 到 3 条最值得先做的，落成具体改动。',
    ideaexpand: '请扩写当前选中的这条灵感。先 get_idea 读它：如果它是由多条灵感合并来的，或库里还有同标签的其他灵感，把能融合的一并融进去。注意原文 text 绝对不要改动，扩写写进 expansion，并追加 2 个不同走向的改写变体到 variants。最后说明你融合了哪几条、各自的取舍。'
  };
  return map[kind] || '';
}

/** 统一的提问入口：直连模式下自己跑 agent 循环，会话模式下把话投给外部 agent */
async function submitPrompt(text) {
  if (!text) return;
  if (S.session.mode === 'agent') {
    S.ai.messages.push({ role: 'user', content: text });
    renderChat();
    if (IO.mode !== 'server') { toast('接入 Agent 会话需要先启动本地服务（启动.bat）', 'err', 5200); return; }
    try {
      const r = await fetch('/api/session/send', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text, context: sessionContext() })
      });
      if (!r.ok) throw new Error((await r.json()).error || ('HTTP ' + r.status));
    } catch (e) {
      toast('发送失败：' + e.message, 'err');
      S.ai.messages.push({ role: 'assistant', content: '发送失败：' + e.message });
      renderChat();
    }
    return;
  }
  runAgent(text);
}

function selLabel(s) {

  if (s.type === 'character') { const c = charById(s.id); return c ? c.name : '角色'; }
  if (s.type === 'place') { const c = placeById(s.id); return c ? c.name : '地点'; }

  if (s.type === 'world') return '世界观';

/* ============================================================================
   19b · Agent 会话桥
   页面被 agent 加载为它界面的一部分时，对话框不再直连模型，而是与 agent 会话互通：
   用户消息投进 /api/session/send，agent 的回复、改动提案与界面指令经由
   /api/session/stream 推回来。协议见 AGENT-BRIDGE.md。
   ========================================================================== */
function sessionContext() {
  const s = S.selection;
  const ev = s && s.type === 'event' ? eventById(s.id) : null;
  const ch = s && s.type === 'chapter' ? findChapter(s.id) : null;
  return {
    file: IO.file || '',
    project: P.meta.name || '',
    view: S.viewMode,
    focus: S.focusId || '',
    selection: s ? { type: s.type, id: s.id, label: selLabel(s) } : null,
    event: ev ? {
      id: ev.id, title: ev.title, kind: ev.kind, trigger: ev.trigger,
      t: ev.t, y: ev.y, summary: ev.summary,
      chapterOf: P.axes.map(a => {
        const c = chapterAt(a, ev.t);
        return a.name + '：' + (c.chapter ? (c.chapter.title || '未命名') : '—');
      })
    } : null,
    chapter: ch ? { id: ch.ch.id, title: ch.ch.title, axis: ch.axis.name, start: ch.ch.start, end: ch.ch.end } : null,
    idea: (s && s.type === 'idea') ? (() => {
      const i = ideaById(s.id);
      if (!i) return null;
      return {
        id: i.id, title: ideaTitle(i), kind: i.kind, status: i.status, tags: i.tags,
        text: (i.text || '').slice(0, 400),
        expansion: (i.expansion || '').slice(0, 400),
        mergedFrom: (i.mergedFrom || []).map(x => ideaTitle(ideaById(x)) || x),
        mergedInto: i.mergedInto ? ideaTitle(ideaById(i.mergedInto)) : '',
        usedBy: i.usedBy
      };
    })() : null,
    counts: {
      events: P.events.length, characters: P.characters.length, places: P.places.length,
      axes: P.axes.length, edges: P.edges.length, links: P.links.length, ideas: P.ideas.length
    }
  };
}

const reportSession = debounce(function () {
  if (IO.mode !== 'server') return;
  fetch('/api/session/report', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },

  }).catch(() => {});
