async function pollSessionStatus() {
  if (IO.mode !== 'server') { S.session.connected = false; S.session.agentListening = false; renderAiStatus(); return; }
  try {
    const r = await fetch('/api/session/status');
    const j = await r.json();
    const wasListening = S.session.agentListening;
    S.session.connected = !!j.pageConnected || true;
    S.session.agentListening = !!j.agentListening;
    if (wasListening !== S.session.agentListening) renderChat();
  } catch (e) {
    S.session.connected = false;
  }
  renderAiStatus();
}

function setSessionMode(mode) {
  S.session.mode = mode;
  try { localStorage.setItem('plotstudio.sessionMode', mode); } catch (e) {}
  if (mode === 'agent') startSessionStream(); else stopSessionStream();
  renderAiStatus(); renderChat();
  reportSession();
}

function stopSessionStream() {
  if (S.session.es) { try { S.session.es.close(); } catch (e) {} S.session.es = null; }
  S.session.connected = false;
}

async function startSessionStream() {
  if (IO.mode !== 'server') { S.session.connected = false; renderAiStatus(); return; }
  stopSessionStream();
  // 先把已有对话恢复出来，再把游标推到末尾——否则重开会把历史上的提案与指令重放一遍
  try {
    const r = await fetch('/api/session/log?since=0');
    const j = await r.json();
    const items = (j.items || []).filter(m => (m.text || '').trim());
    S.ai.messages = items.slice(-80).map(m => ({
      role: m.from === 'user' ? 'user' : 'assistant',
      content: m.text
    }));
    S.session.since = items.length ? items[items.length - 1].id : 0;
  } catch (e) { S.session.since = 0; }
  renderChat();

  const es = new EventSource('/api/session/stream?since=' + S.session.since);
  es.addEventListener('item', ev => {
    let it = null;
    try { it = JSON.parse(ev.data); } catch (e) { return; }
    if (!it) return;
    S.session.since = Math.max(S.session.since, it.id);
    if (it.from === 'agent') handleAgentItem(it);
  });
  es.addEventListener('hello', ev => {
    // 服务可能重启过，序号会从头开始；此时把游标退回去，否则会一直收不到新消息
    try {
      const h = JSON.parse(ev.data || '{}');
      if (typeof h.seq === 'number' && h.seq < S.session.since) S.session.since = h.seq;
    } catch (e) {}
    S.session.connected = true;
    renderAiStatus();
  });
  es.onopen = () => { S.session.connected = true; renderAiStatus(); };
  es.onerror = () => { S.session.connected = false; renderAiStatus(); };
  S.session.es = es;
  S.session.connected = true;
  renderAiStatus();
  reportSession();
}

/** 处理 agent 推来的一条消息：文本 / 改动提案 / 界面指令可以同时存在 */
function handleAgentItem(it) {
  if ((it.text || '').trim()) {
    S.ai.messages.push({ role: 'assistant', content: it.text });
  }
  for (const c of (it.commands || [])) {
    try { execSessionCommand(c.cmd, c.args || {}); } catch (e) {}
  }
  if (it.patch && it.patch.ops && it.patch.ops.length) {
    const prop = { id: uid('pp'), summary: it.patch.summary || '（agent 改动）', ops: it.patch.ops, fromAgent: true };
    prop.textOnly = prop.ops.every(isTextOp);
    S.ai.pending = S.ai.pending || [];
    S.ai.pending.push(prop);
    const auto = S.ai.autoMode === 'all' || (prop.textOnly && S.ai.autoMode === 'text');
    if (auto) applyProposal(prop.id);
    else toast('agent 提交了一批改动，等待你确认', 'warn', 4200);
  }
  renderChat();
  renderAiStatus();
}

/** agent 可以驱动界面：选中、定位、切视图、打开剧情、重载等 */
function execSessionCommand(cmd, args) {
  if (cmd === 'select') {
    if (!args.type || !args.id) return;
    select(args.type, args.id);
    if (args.center) { const e = eventById(args.id); if (e) centerOn(e); }
  } else if (cmd === 'center') {
    const e = eventById(args.id); if (e) { select('event', e.id); centerOn(e); }
  } else if (cmd === 'focusEntity') {
    setView(args.kind === 'place' ? 'place' : 'character');
    S.focusId = args.id || '';
    fitView();
    renderAll();
  } else if (cmd === 'view') {
    setView(['timeline', 'character', 'place', 'ideas'].indexOf(args.mode) >= 0 ? args.mode : 'timeline');
  } else if (cmd === 'scene') {
    if (eventById(args.id)) openSceneEditor(args.id);
  } else if (cmd === 'fit') {
    fitView();
  } else if (cmd === 'reload') {
    if (IO.mode === 'server') applyExternal();
  } else if (cmd === 'undo') {
    undo();
  } else if (cmd === 'redo') {
    redo();
  } else if (cmd === 'toast') {
    toast(args.text || '', args.kind || '');
  }
}

async function boot() {
  if (window.__plotStudioBooted) return;   // 幂等：避免被重复加载时产生两套监听与两条文件监听
  window.__plotStudioBooted = true;
  initArrowDefs();
  initCanvasInteractions();
  initKeyboard();
  wireTopbar();
  wireIdeaBoard();
  renderAiChrome();

  try {
    const saved = JSON.parse(localStorage.getItem('plotstudio.ai') || '{}');
    if (saved.baseURL) AICFG.baseURL = saved.baseURL;
    if (saved.model) AICFG.model = saved.model;
    if (saved.autoMode) S.ai.autoMode = saved.autoMode;
  } catch (e) {}
  if (!S.ai.autoMode) S.ai.autoMode = 'text';

  const ok = await probeServer();
  if (ok) {
    IO.mode = 'server';
    let cfg = {};
    try { cfg = await (await fetch('/api/config')).json(); } catch (e) {}
    AICFG.baseURL = cfg.baseURL || AICFG.baseURL;
    AICFG.model = cfg.model || AICFG.model;
    AICFG.hasKey = !!cfg.hasKey; AICFG.keyTail = cfg.keyTail || '';

    let list = { projects: [] };
    try { list = await (await fetch('/api/list')).json(); } catch (e) {}
    let file = localStorage.getItem('plotstudio.lastFile');
    if (!file || !(list.projects || []).some(p => p.file === file)) file = (list.projects[0] || {}).file || '';
    if (file) {
      try { await loadFromServer(file); toast('已打开工程 ' + file, 'ok', 2000); }
      catch (e) { P = normalize(sampleProject()); IO.file = '默认工程.json'; afterLoad(); await saveToServer(); }
    } else {
      P = normalize(sampleProject());
      IO.file = '默认工程.json';
      afterLoad();
      await saveToServer();
    }
    localStorage.setItem('plotstudio.lastFile', IO.file);
    watchFile();
    setSavePill('ok', '已连接本地服务');
  } else {
    IO.mode = 'offline';
    setSavePill('warn', '未连接本地服务');
    let P0 = null;
    try { const b = localStorage.getItem('plotstudio.backup'); if (b) P0 = JSON.parse(b); } catch (e) {}
    P = normalize(P0 || sampleProject());
    afterLoad();
    toast('未检测到本地服务，已进入受限模式：编辑与存档可用（导出 JSON / 浏览器草稿），AI 走浏览器直连。双击「启动.bat」可开启完整模式。', 'warn', 8000);
  }
  // 相机优先沿用工程里保存的视图；只有在没有事件时才自动适应，避免每次打开都被缩成一片小点
  if (!P.events.length) fitView();
  else { applyTransform(); }

  // 会话模式：URL 参数 ?agent=1 / ?agent=0 优先，其次沿用本地记忆
  let sm = null;
  try { sm = new URLSearchParams(location.search).get('agent'); } catch (e) {}
  let mode = sm === '1' || sm === 'true' ? 'agent' : (sm === '0' ? 'direct' : null);
  if (!mode) { try { mode = localStorage.getItem('plotstudio.sessionMode'); } catch (e) {} }
  S.session.mode = mode === 'agent' ? 'agent' : 'direct';
  if (S.session.mode === 'agent' && IO.mode === 'server') {
    await startSessionStream();
    pollSessionStatus();
  }
  setInterval(() => {
    if (S.session.mode !== 'agent') return;
    reportSession();
    pollSessionStatus();
  }, 10000);

  renderAll();
  updateHistoryButtons();
}

/* ============================================================================
   21 · 灵感板（ADR-0007）

   灵感是尚未组织进故事的零散想法：不落在画布上、不占逻辑时间、不属于任何轴，
   所以它是一块独立于画布的卡片墙，而不是时间线的又一种投影。
   三条不可动摇的规则：
     · text 是原文，永不被改写；扩写与修改写只追加到 expansion / variants
     · 采用是引用而非搬运：灵感不消失，只记 usedBy 并转状态
     · 合并是软合并：被合并的条目留在库里标记去向，可追溯也可反悔
   ========================================================================== */

function newIdea(data) {
  const d = data || {};
  return {
    id: uid('id'),
    text: d.text || '',
    title: d.title || '',
    kind: IDEA_KINDS[d.kind] ? d.kind : 'note',
    tags: d.tags || [],
    characterIds: d.characterIds || [],
    placeIds: d.placeIds || [],
    status: IDEA_STATUS[d.status] ? d.status : 'raw',
    usedBy: d.usedBy || [],
    mergedInto: d.mergedInto || '',
    mergedFrom: d.mergedFrom || [],
    expansion: d.expansion || '',
    variants: d.variants || [],
    createdAt: nowLabel(),
    updatedAt: nowLabel()
  };
}

/** 命中当前筛选。q 同时匹配原文、标题、标签、扩写与改写变体 */
function ideaMatches(i) {
  const f = S.ideaFilter;
  if (f.status !== 'all' && i.status !== f.status) return false;
  if (f.kind !== 'all' && i.kind !== f.kind) return false;
  const q = (f.q || '').trim().toLowerCase();
  if (q) {
    const hay = [i.title, i.text, i.expansion, (i.tags || []).join(' '),
      (i.variants || []).map(v => v.text).join(' ')].join('\n').toLowerCase();
    if (hay.indexOf(q) < 0) return false;
  }
  return true;
}
function filteredIdeas() { return P.ideas.filter(ideaMatches); }

/* ---- 顶部输入与筛选 ---- */

function wireIdeaBoard() {

    return made;
  };
  const quick = $('#ibQuick');
  if (quick) quick.addEventListener('keydown', e => {

  });

function ideaCard(i) {
  const used = (i.usedBy || []).length;
  const cls = 'ib-card' + (isSel('idea', i.id) ? ' sel' : '') +
    (i.status === 'merged' ? ' merged' : '') + (i.status === 'used' ? ' used' : '');
  const foot = ['<span class="ib-badge k">' + esc(IDEA_KINDS[i.kind].name) + '</span>'];
  if (i.status !== 'raw') foot.push('<span class="ib-badge s-' + i.status + '">' + esc(IDEA_STATUS[i.status].name) + '</span>');
  if ((i.mergedFrom || []).length) foot.push('<span class="ib-badge">合并 ' + i.mergedFrom.length + ' 条</span>');
  if (i.expansion) foot.push('<span class="ib-badge">有扩写</span>');
  if ((i.variants || []).length) foot.push('<span class="ib-badge">变体 ' + i.variants.length + '</span>');
  for (const t of (i.tags || []).slice(0, 4)) foot.push('<span class="ib-badge tag">#' + esc(t) + '</span>');
  for (const cid of (i.characterIds || []).slice(0, 3)) { const c = charById(cid); if (c) foot.push('<span class="ib-badge">' + esc(c.name) + '</span>'); }
  for (const pid of (i.placeIds || []).slice(0, 3)) { const p = placeById(pid); if (p) foot.push('<span class="ib-badge">' + esc(p.name) + '</span>'); }

  const card = el('div', { class: cls, title: '点击编辑 · Shift/Ctrl+点击 多选' },
    (used ? '<div class="ibc-mark" title="已被采用 ' + used + ' 次">' + used + '</div>' : '') +
    '<div class="ibc-top"><div class="ibc-title">' + esc(ideaTitle(i)) + '</div></div>' +
    (i.title ? '<div class="ibc-text">' + esc((i.text || '').slice(0, 220)) + '</div>' : '') +
    '<div class="ibc-foot">' + foot.join('') + '</div>');
  card.addEventListener('click', e => {
    if (e.shiftKey || e.ctrlKey || e.metaKey) {
      if (S.multi.has(i.id)) S.multi.delete(i.id); else S.multi.add(i.id);
      S.selection = { type: 'idea', id: i.id };
      renderIdeasBoard(); renderInspector();
      return;
    }
    S.multi.clear();
    select('idea', i.id);
  });
  return card;
}

    '几条零散的想法若其实是一件事，多选后<b>合并为一条</b>收拢。合并是软合并，随时可以拆开，原文一条都不会丢。<br><br>' +
    '在 AI 面板点「扫描灵感库找机会」，可以让它通读整个库，告诉你哪条适合放进哪里、哪些可以合到一起。'));

function ideaFacet(label, key, value, n) {
  const node = el('div', { class: 'ib-facet-item' + (S.ideaFilter[key] === value ? ' on' : '') },
    '<span>' + esc(label) + '</span><span class="n">' + n + '</span>');
  node.addEventListener('click', () => { S.ideaFilter[key] = value; renderAll(); });
  return node;
}

/* ---- 动作 ---- */

function ideaAdd(text, kind) {
  pushUndo();
  const i = newIdea({ text: (text || '').trim(), kind: kind || 'note' });
  P.ideas.push(i);
  markDirty();
  renderAll();
  select('idea', i.id);
  return i;
}

function ideaSetStatus(id, status) {
  const i = ideaById(id);
  if (!i || !IDEA_STATUS[status]) return;
  pushUndo();
  i.status = status;
  i.updatedAt = nowLabel();
  markDirty(); renderAll();
  toast('已标记为「' + IDEA_STATUS[status].name + '」', 'ok', 1600);
}

function deleteIdeas() {
  let ids = S.multi.size ? Array.from(S.multi)
    : (S.selection && S.selection.type === 'idea' ? [S.selection.id] : []);
  ids = ids.filter(id => !!ideaById(id));
  if (!ids.length) return;
  const hasSummary = ids.some(id => ((ideaById(id) || {}).mergedFrom || []).length);
  if (!confirmBox('确定删除这 ' + ids.length + ' 条灵感？' +
    (hasSummary ? '\n\n其中包含由多条灵感合并出来的条目，删掉它，来源关系也就断了。' : ''))) return;
  pushUndo();
  P.ideas = P.ideas.filter(i => !ids.includes(i.id));
  // 清掉指向被删条目的软合并指针与采用记录，避免留下悬空引用
  P.ideas.forEach(i => {
    if (ids.includes(i.mergedInto)) i.mergedInto = '';
    i.mergedFrom = (i.mergedFrom || []).filter(x => !ids.includes(x));
    i.usedBy = (i.usedBy || []).filter(u => !ids.includes(u.id));
  });
  S.multi.clear();
  S.selection = null;
  markDirty(); renderAll();
  toast('已删除 ' + ids.length + ' 条灵感');
}

/** 软合并的内核：只负责改数据，返回汇总条目。调用方负责 pushUndo 与重渲染 */
function mergeIdeasCore(ids, extra) {
  const use = (ids || []).filter(id => { const i = ideaById(id); return i && i.status !== 'merged'; });
  if (use.length < 2) return null;
  const pick = k => {
    const out = [];
    for (const id of use) for (const v of (ideaById(id)[k] || [])) if (out.indexOf(v) < 0) out.push(v);
    return out;
  };
  const sum = newIdea({
    text: use.map(id => {
      const i = ideaById(id);
      return (i.title ? '【' + i.title + '】\n' : '') + i.text;
    }).join('\n\n— — —\n\n'),
    title: (extra && extra.title) || ('合并：' + use.map(id => ideaTitle(ideaById(id))).join(' + ')).slice(0, 60),
    kind: (extra && extra.kind) || ideaById(use[0]).kind,
    tags: pick('tags'),
    characterIds: pick('characterIds'),
    placeIds: pick('placeIds'),
    mergedFrom: use.slice()
  });
  // 来源自己若也是合并来的，把更早的来源一并挂上，保持可追溯
  const deeper = [];
  for (const id of use) {
    for (const src of (ideaById(id).mergedFrom || [])) {
      if (use.indexOf(src) < 0 && sum.mergedFrom.indexOf(src) < 0 && deeper.indexOf(src) < 0) deeper.push(src);
    }
  }
  sum.mergedFrom = sum.mergedFrom.concat(deeper);
  P.ideas.push(sum);
  for (const id of use) {
    const i = ideaById(id);
    i.status = 'merged';
    i.mergedInto = sum.id;
    i.updatedAt = nowLabel();
  }
  return sum;
}

function ideaMerge(ids) {
  const use = (ids || []).filter(id => { const i = ideaById(id); return i && i.status !== 'merged'; });
  if (use.length < 2) { toast('至少选中两条未合并的灵感才能合并', 'warn'); return; }
  pushUndo();
  const sum = mergeIdeasCore(use, null);
  S.multi.clear();
  markDirty(); renderAll();
  if (sum) select('idea', sum.id);
  toast('已合并 ' + use.length + ' 条灵感，来源仍保留在库里', 'ok');
}

/** 反悔：把一条被合并走的灵感恢复成未采用，并从汇总条目里摘掉 */
function ideaUnmerge(id) {
  const i = ideaById(id);
  if (!i || !i.mergedInto) return;
  const sumId = i.mergedInto;
  const sum = ideaById(sumId);
  pushUndo();
  i.status = 'raw';
  i.mergedInto = '';
  i.updatedAt = nowLabel();
  if (sum) sum.mergedFrom = (sum.mergedFrom || []).filter(x => x !== id);
  markDirty(); renderAll();
  toast('已从合并中拆出，恢复为未采用', 'ok');
}

/** 转为新事件：原文进详细设定，灵感原件不动，只记 usedBy */
function ideaAdoptAsEvent(id) {
  const i = ideaById(id);
  if (!i) return;
  pushUndo();
  const box = $('#canvasWrap').getBoundingClientRect();
  const w = screenToWorld(box.left + box.width / 2, box.top + box.height / 2);
  const ev = newEvent(w.x, w.y);
  ev.title = (i.title || '').trim() || ideaTitle(i);
  ev.brief = i.text;
  ev.kind = 'side';
  ev.characterIds = (i.characterIds || []).slice();
  ev.placeIds = (i.placeIds || []).slice();
  ev.tags = (i.tags || []).slice();
  P.events.push(ev);
  i.status = 'used';
  i.usedBy.push({ type: 'event', id: ev.id, eventId: ev.id, label: ev.title });
  i.updatedAt = nowLabel();
  markDirty();
  setView('timeline');
  select('event', ev.id);
  centerOn(ev);
  toast('已转为事件，原文仍留在灵感库里', 'ok', 3200);
}

/** 挂到已有事件：mode = step（作为剧情步骤）| brief（追加到详细设定） */
function ideaAttach(id, mode) {
  const i = ideaById(id);
  if (!i) return;
  if (!P.events.length) { toast('工程里还没有事件，先用「转为事件」建一个吧', 'warn'); return; }
  pickEvent(mode === 'step' ? '把灵感作为剧情步骤挂到哪个事件' : '把灵感追加到哪个事件的详细设定', ev => {
    pushUndo();
    if (mode === 'step') {
      ev.scene.steps.push({
        id: uid('st'), type: 'custom', children: [],
        fields: { kind: ideaTitle(i), text: i.text }
      });
      i.usedBy.push({ type: 'step', id: ev.id, eventId: ev.id, label: ev.title });
    } else {
      ev.brief = (ev.brief ? ev.brief.replace(/\s*$/, '') + '\n\n' : '') + i.text;
      i.usedBy.push({ type: 'note', id: ev.id, eventId: ev.id, label: ev.title });
    }
    i.status = 'used';
    i.updatedAt = nowLabel();
    markDirty(); renderAll();
    toast('已挂到「' + ev.title + '」，灵感原件仍在库里', 'ok', 3000);
  });
}

/** 事件选择器。事件多了要能靠标题筛，否则选不动 */
function pickEvent(title, cb) {
  const list = P.events.slice().sort((a, b) => a.t - b.t);
  const rows = ev => '<div class="ib-pick" data-pick="' + ev.id + '">' +
    '<span class="d">t=' + Math.round(ev.t) + '</span>' +
    '<span class="t">' + esc(ev.title) + '</span>' +
    '<span class="d">' + esc(KINDS[ev.kind] ? KINDS[ev.kind] : '') + '</span></div>';
  showModal(
    '<div class="modal narrow">' +
      '<div class="m-head"><div class="m-title">' + esc(title) + '</div><button class="m-close" data-close="1">×</button></div>' +
      '<div class="m-body">' +
        '<input class="inp" id="pickQ" placeholder="按标题筛选…" spellcheck="false">' +
        '<div id="pickList" style="margin-top:8px;max-height:46vh;overflow-y:auto"></div>' +
      '</div>' +
      '<div class="m-foot"><button class="btn" data-close="1">取消</button></div>' +
    '</div>');
  $$('#mask [data-close]').forEach(n => n.addEventListener('click', closeMask));
  const paint = q => {
    const qq = (q || '').trim().toLowerCase();
    const arr = list.filter(e => !qq || (e.title || '').toLowerCase().indexOf(qq) >= 0);
    $('#pickList').innerHTML = arr.length ? arr.map(rows).join('')
      : '<div class="empty-note">没有匹配的事件</div>';
    $$('#pickList [data-pick]').forEach(n => n.addEventListener('click', () => {
      const ev = eventById(n.dataset.pick);
      closeMask();
      if (ev) cb(ev);
    }));
  };
  paint('');
  $('#pickQ').addEventListener('input', e => paint(e.target.value));
  $('#pickQ').focus();
}

/* ---- 检查器 ---- */

function inspIdeaEmpty(host) {
  INSP = { kind: 'idea-empty', obj: null };
  host.innerHTML = '<div class="insp-empty">' +
    '灵感库里的每一条都只是半成品，不需要现在就决定它属于哪里。<br><br>' +
    '在上面的输入框里写点什么，回车即存。<br>' +
    '<span class="kbd">Shift / Ctrl + 点击卡片</span> 多选，多选后可合并。<br><br>' +
    '选中一条后，这里会变成它的编辑器：可以把它转为事件、挂到已有事件，或让 AI 顺着它扩写。' +
    '</div>';
}

function inspIdea(host, i) {
  if (!i) return;
  INSP = { kind: 'idea', obj: i };
  const b = head(host, ideaTitle(i), i.id + ' · 更新于 ' + (i.updatedAt || '未知'));

  const kindOpts = {}, statusOpts = {};
  IDEA_KIND_ORDER.forEach(k => { kindOpts[k] = IDEA_KINDS[k].name; });
  Object.keys(IDEA_STATUS).forEach(k => { statusOpts[k] = IDEA_STATUS[k].name; });

  const origin = [];
  if ((i.mergedFrom || []).length) {
    origin.push('合并自：' + i.mergedFrom.map(x => esc(ideaTitle(ideaById(x)) || '（已删除）')).join('、'));
  }
  if (i.mergedInto) origin.push('已并入：' + esc(ideaTitle(ideaById(i.mergedInto)) || '（已删除）'));
  if ((i.usedBy || []).length) {
    origin.push('已用于：' + i.usedBy.map(u => esc(u.label || u.id || '')).filter(Boolean).join('、'));
  }

  b.innerHTML =
    field('短标题', inp('title', i.title, '留空则用原文首行')) +
    '<div class="two">' +
      field('类型', selBox('kind', i.kind, kindOpts)) +
      field('状态', selBox('status', i.status, statusOpts)) +
    '</div>' +
    field('原文', ta('text', i.text, '当初随手写下的那句话。它不会被任何操作改写。', 8),
      '扩写与改写都只追加到下面，原文始终原样保留。') +
    field('标签', inp('tags', (i.tags || []).join(', '), '逗号分隔')) +
    field('关联角色', chipList('char', i.characterIds, () => P.characters, id => { const c = charById(id); return c && c.name; }, '关联角色…')) +
    field('关联地点', chipList('place', i.placeIds, () => P.places, id => { const p = placeById(id); return p && p.name; }, '关联地点…')) +
    field('扩写', ta('expansion', i.expansion, '让 AI 顺着它写长，或自己动手。', 6)) +
    ((i.variants || []).length
      ? '<div class="field"><label>改写变体</label>' + i.variants.map(v =>
          '<div class="dep-item"><span class="t" style="white-space:pre-wrap">' + esc(v.text) + '</span>' +
          '<button class="x" data-vardel="' + v.id + '" title="删除这个变体">×</button></div>').join('') +
        '</div>'
      : '') +
    (origin.length ? '<div class="ib-origin">' + origin.join('<br>') + '</div>' : '') +
    '<div class="ai-sec-title">写进剧情</div>' +
    '<div class="batch-bar">' +
      '<button class="btn primary sm" data-act="idea-to-event">转为事件</button>' +
      '<button class="btn sm" data-act="idea-to-step">挂为剧情步骤</button>' +
      '<button class="btn sm" data-act="idea-to-brief">追加到事件设定</button>' +
    '</div>' +
    '<div class="batch-bar">' +
      '<button class="btn sm" data-act="idea-status:used">标记已采用</button>' +
      '<button class="btn sm" data-act="idea-status:parked">搁置</button>' +
      '<button class="btn sm" data-act="idea-status:raw">恢复未采用</button>' +
    '</div>' +
    (i.mergedInto
      ? '<button class="btn sm block" data-act="idea-unmerge" style="margin-top:8px">从合并中拆出</button>'
      : '') +
    '<div class="insp-actions"><button class="btn danger" data-act="idea-del">删除这条灵感</button></div>';

  wireInspector(i);
  $$('[data-vardel]', host).forEach(n => n.addEventListener('click', () => {
    pushUndo();
    i.variants = i.variants.filter(v => v.id !== n.dataset.vardel);
    i.updatedAt = nowLabel();
    markDirty(); renderAll();
  }));
}

function inspIdeaBatch(host) {
  INSP = { kind: 'idea-batch', obj: null };
  const items = Array.from(S.multi).map(ideaById).filter(Boolean);
  const b = head(host, '已选中 ' + items.length + ' 条灵感', '多选 · 可合并');
  b.innerHTML =
    '<div class="hint-box">合并会把这几条的原文按顺序拼成一条新的汇总灵感，并把它们标记为「已合并」保留在库里。' +
    '<b>原文一条都不会丢</b>，随时可以在单条上「从合并中拆出」。</div>' +
    '<div class="batch-bar">' +
      '<button class="btn primary sm" data-act="idea-merge">合并为一条</button>' +
      '<button class="btn sm" data-act="idea-sel-clear">取消选择</button>' +
      '<button class="btn danger sm" data-act="idea-del-selected">删除这 ' + items.length + ' 条</button>' +
    '</div>' +
    '<div class="field" style="margin-top:12px"><label>选中项</label><div class="dep-list">' +
      items.map(i => '<div class="dep-item"><span class="t">' + esc(ideaTitle(i)) + '</span>' +
        '<span class="dir">' + esc(IDEA_KINDS[i.kind].name) + '</span></div>').join('') +
    '</div></div>';
  wireInspector(null);
}

boot();
</script>
